# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
pro: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

builds:
  - id: "agent"
    builder: rust
    # Build through cargo-auditable (wrapper baked into the builder image) so each
    # binary embeds its dependency tree in a `.dep-v0` ELF section. With `command:
    # zigbuild` below, GoReleaser runs `cargo-auditable-zigbuild zigbuild
    # --target=... --release -p=miru-agent`, i.e. `cargo auditable zigbuild ...`.
    tool: cargo-auditable-zigbuild
    binary: "miru-agent"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    dir: ..
    command: zigbuild
    flags:
      - --release
      - -p=miru-agent

  - id: "agent-windows"
    # Built natively on a Windows runner (aws-lc-sys cannot cross-compile
    # from Linux) through `cargo auditable`, so the PE also carries a
    # `.dep-v0` section. The workflow downloads the runner's artifact into
    # build/prebuilt/windows_amd64/ before GoReleaser runs; the prebuilt
    # builder fails loudly if the file is missing.
    builder: prebuilt
    goos: [windows]
    goarch: [amd64]
    prebuilt:
      path: prebuilt/{{ .Os }}_{{ .Arch }}/miru-agent.exe
    binary: miru-agent

nfpms:
  - id: agent
    ids: ["agent"]
    package_name: miru-agent
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: "Miru"
    homepage: "https://mirurobotics.com"
    maintainer: "Benjamin Smidt <ben@mirurobotics.com>"
    description: |
      Miru Agent.
      Miru provides the infrastructure to version, manage, and deploy application configurations at scale. This debian package is the miru agent, which handles configuration deployment to your robots in production.
    
    formats:
      - deb

    section: "default"
    priority: "extra"
    dependencies:
      - systemd
      - pkg-config | pkgconf # pkgconf is the updated version of pkg-config
      - libc6

    contents:
      - src: "{{ .ArtifactPath }}"
        dst: "/usr/lib/miru/miru-agent-{{ .Version }}"
        file_info:
          owner: miru
          group: miru
          mode: 0755
      - src: "../lib/miru/miru-agent-{{ .Version }}"
        dst: "/usr/sbin/miru-agent"
        type: symlink
      - src: "debian/miru.service"
        dst: "/lib/systemd/system/miru.service"
        file_info:
          mode: 0644
      - src: "debian/miru.socket"
        dst: "/lib/systemd/system/miru.socket"
        file_info:
          mode: 0644
      - src: "debian/miru-agent.tmpfiles"
        dst: "/usr/lib/tmpfiles.d/miru-agent.conf"
        file_info:
          mode: 0644
      - src: "debian/copyright"
        dst: "/usr/share/doc/miru-agent/copyright"
        file_info:
          mode: 0644

    scripts:
      postinstall: "debian/postinst"
      postremove: "debian/postrm"

archives:
  - id: agent
    ids: ["agent", "agent-windows"]
    formats: [tar.gz]
    name_template: >-
      agent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

# Generate SPDX-JSON SBOMs via syft (GoReleaser's default SBOM cmd), uploaded
# with the release via the release stanza. Scan the binary and the archive — not
# the .deb: syft's cargo-auditable cataloger reads the `.dep-v0` section out of
# the binary for ELF, PE and Mach-O alike (so the Windows `miru-agent.exe` is
# covered too), and recurses into the tar.gz/zip to find it, so those SBOMs
# list every linked crate. A .deb scan only reads DPKG control metadata and
# never inspects the nested binary, so it can never enumerate dependencies.
sboms:
  - id: archive
    artifacts: archive
  - id: binary
    artifacts: binary

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Reversions
      regexp: '^.*?revert(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Others
      order: 999

  filters:
    include:
      - "^feat"
      - "^fix"
      - "^refactor"
      - "^perf"
      - "^revert"

release:
  prerelease: auto
  github:
    owner: mirurobotics
    name: agent
  extra_files:
    # Debug symbols for the Windows executable, attached as their own asset
    # so the zip stays a clean install artifact. The file keeps the name
    # recorded in miru-agent.exe's debug directory (Cargo writes
    # miru_agent.pdb) because debuggers look for exactly that name next
    # to the executable.
    - glob: ./prebuilt/windows_amd64/miru_agent.pdb
  footer: >-
    ## Miru Agent {{.Tag}}

    **Full Changelog**: https://github.com/mirurobotics/agent/compare/{{ .PreviousTag }}...{{ .Tag }}
    

    For documentation, visit: https://docs.mirurobotics.com

source:
  enabled: false

report_sizes: true

