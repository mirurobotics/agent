# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2
pro: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

builds:
  - id: "agent"
    builder: rust
    # cargo auditable embeds the dependency tree in the binary for the SBOMs.
    tool: cargo-auditable-zigbuild
    binary: "miru-agent"
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    dir: ..
    command: zigbuild
    flags:
      - --release
      - -p=miru-daemon

  - id: "agent-windows"
    # aws-lc-sys can't cross-compile to Windows, so the release workflow builds
    # and signs this binary on a Windows runner. It must build with cargo
    # auditable too, or the Windows SBOM lists no dependencies.
    builder: prebuilt
    # Snapshot builds have no Windows binary to package.
    skip: "{{ .IsSnapshot }}"
    goos:
      - windows
    goarch:
      - amd64
    binary: "miru-agent"
    prebuilt:
      # Relative to build/, GoReleaser's working directory.
      path: prebuilt/windows_amd64/miru-agent.exe

nfpms:
  - id: agent
    ids: ["agent"]
    package_name: miru-agent
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    vendor: "Miru"
    homepage: "https://mirurobotics.com"
    maintainer: "Benjamin Smidt <ben@mirurobotics.com>"
    description: |
      Miru Daemon.
      Miru builds DevOps infrastructure for robotics. This Debian package installs the Miru Daemon, which runs on your robots and connects them to the Miru control plane.
    
    formats:
      - deb

    section: "default"
    priority: "extra"
    dependencies:
      - systemd
      - pkg-config | pkgconf # pkgconf is the updated version of pkg-config
      - libc6

    contents:
      - src: "{{ .ArtifactPath }}"
        dst: "/usr/lib/miru/miru-agent-{{ .Version }}"
        file_info:
          owner: miru
          group: miru
          mode: 0755
      - src: "../lib/miru/miru-agent-{{ .Version }}"
        dst: "/usr/sbin/miru-agent"
        type: symlink
      - src: "debian/miru.service"
        dst: "/lib/systemd/system/miru.service"
        file_info:
          mode: 0644
      - src: "debian/miru.socket"
        dst: "/lib/systemd/system/miru.socket"
        file_info:
          mode: 0644
      - src: "debian/miru-agent.tmpfiles"
        dst: "/usr/lib/tmpfiles.d/miru-agent.conf"
        file_info:
          mode: 0644
      - src: "debian/copyright"
        dst: "/usr/share/doc/miru-agent/copyright"
        file_info:
          mode: 0644

    scripts:
      postinstall: "debian/postinst"
      postremove: "debian/postrm"

archives:
  - id: agent
    ids: ["agent", "agent-windows"]
    formats: [tar.gz]
    name_template: >-
      agent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

# Not the .deb: syft reads only its package metadata, never the dependency tree
# embedded in the binary.
sboms:
  - id: archive
    artifacts: archive
  - id: binary
    artifacts: binary

# release.extra_files aren't checksummed by default, so add the MSI.
checksum:
  extra_files:
    - glob: ./prebuilt/windows_amd64/*.msi

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Reversions
      regexp: '^.*?revert(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Others
      order: 999

  filters:
    include:
      - "^feat"
      - "^fix"
      - "^refactor"
      - "^perf"
      - "^revert"

release:
  prerelease: auto
  github:
    owner: mirurobotics
    name: agent
  extra_files:
    # Kept out of the zip, and named as recorded in the .exe so debuggers find it.
    - glob: ./prebuilt/windows_amd64/miru_agent.pdb
    - glob: ./prebuilt/windows_amd64/*.msi
  footer: >-
    ## Miru Daemon {{.Tag}}

    **Full Changelog**: https://github.com/mirurobotics/agent/compare/{{ .PreviousTag }}...{{ .Tag }}
    

    For documentation, visit: https://docs.mirurobotics.com

source:
  enabled: false

report_sizes: true

