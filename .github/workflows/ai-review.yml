# Required AI review of every non-draft PR, and an advisory design review
# of drafts. Posts the `ai-review` status checked by branch protection.
# See the reusable workflow for details.
#
# pull_request_target runs this file from the base branch, so a PR cannot
# edit or delete its own review.
#
# The reusable workflow is pinned to a commit, so a change to it only takes
# effect here through a reviewed PR that bumps the SHA.

name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-review:
    uses: mirurobotics/.github/.github/workflows/ai-review.yml@bf0916104b6b5b5373c09a5f5b413ec6bded2cb5
    with:
      runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
