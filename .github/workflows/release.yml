name: Release

on:
  push:
    tags:
      - '*'

permissions:
  checks: write
  contents: write
  packages: write
  pull-requests: read

jobs:

  check-main:
    name: Verify tag is on main
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check ancestry
        id: check
        run: |
          git fetch origin main 'refs/heads/release/*:refs/remotes/origin/release/*'
          ON_MAIN=false
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            ON_MAIN=true
          else
            for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/); do
              if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
                ON_MAIN=true
                break
              fi
            done
          fi
          echo "on_main=$ON_MAIN" >> "$GITHUB_OUTPUT"
          if [ "$ON_MAIN" = "false" ]; then
            echo "::notice::Tag is not on main or release/* — skipping release."
          fi

  ci:
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    uses: ./.github/workflows/ci.yml

  # Build the Windows release binary natively (aws-lc-sys cannot cross-compile
  # from Linux) and hand it to the release job, which imports it through
  # GoReleaser's prebuilt builder. Kept here rather than in ci.yml because it
  # produces a release artifact, not a validation signal.
  windows-release-build:
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    env:
      # Line/module-level debug info so the shipped PDB supports symbolized
      # backtraces. On MSVC debug info is "packed" into the .pdb, so the .exe
      # is unchanged. Job-scoped on purpose: the Linux lane keeps
      # [profile.release] debug = false from Cargo.toml.
      CARGO_PROFILE_RELEASE_DEBUG: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-msvc
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install cargo-auditable
        uses: taiki-e/install-action@47345a21ef01b2d0e9b59e2e41d51f17780e1b0d # cargo-auditable
        with:
          tool: cargo-auditable@0.7.6

      - name: Build Windows Release (cargo auditable)
        run: cargo auditable build --release --target x86_64-pc-windows-msvc -p miru-agent --locked

      - name: Stage prebuilt artifacts
        shell: pwsh
        run: |
          $out = "build\prebuilt\windows_amd64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\miru-agent.exe $out
          Copy-Item target\x86_64-pc-windows-msvc\release\miru_agent.pdb $out
          Get-ChildItem $out
          & "$out\miru-agent.exe" version

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-windows-amd64-msvc
          path: build/prebuilt/windows_amd64/
          if-no-files-found: error

  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, check-main, windows-release-build]
    if: needs.check-main.outputs.on_main == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch the entire history so that we can correctly determine the previous tag
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows prebuilt artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-windows-amd64-msvc
          path: build/prebuilt/windows_amd64

      - name: Show Windows prebuilt artifacts
        run: ls -l build/prebuilt/windows_amd64

      - name: Release
        run: ./build/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
