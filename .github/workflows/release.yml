name: Release

on:
  push:
    tags:
      - '*'

permissions:
  checks: write
  contents: write
  packages: write
  # Required by the ci.yml windows-package-scope job, which this workflow calls.
  # The called ci.yml also runs windows-release-build, whose
  # agent-windows-amd64-msvc artifact the release job below downloads for
  # GoReleaser's prebuilt Windows build.
  pull-requests: read

jobs:

  check-main:
    name: Verify tag is on main
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check ancestry
        id: check
        run: |
          git fetch origin main 'refs/heads/release/*:refs/remotes/origin/release/*'
          ON_MAIN=false
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            ON_MAIN=true
          else
            for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/); do
              if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
                ON_MAIN=true
                break
              fi
            done
          fi
          echo "on_main=$ON_MAIN" >> "$GITHUB_OUTPUT"
          if [ "$ON_MAIN" = "false" ]; then
            echo "::notice::Tag is not on main or release/* — skipping release."
          fi

  ci:
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, check-main]
    if: needs.check-main.outputs.on_main == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch the entire history so that we can correctly determine the previous tag
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows prebuilt artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-windows-amd64-msvc
          path: build/prebuilt/windows_amd64

      - name: Show Windows prebuilt artifacts
        run: ls -l build/prebuilt/windows_amd64

      - name: Release
        run: ./build/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
