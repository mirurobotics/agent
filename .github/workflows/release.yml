name: Release

on:
  push:
    tags:
      - '*'

permissions:
  checks: write
  contents: write
  packages: write
  pull-requests: read

jobs:

  check-main:
    name: Verify tag is on main
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check ancestry
        id: check
        run: |
          git fetch origin main 'refs/heads/release/*:refs/remotes/origin/release/*'
          ON_MAIN=false
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            ON_MAIN=true
          else
            for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/release/); do
              if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
                ON_MAIN=true
                break
              fi
            done
          fi
          echo "on_main=$ON_MAIN" >> "$GITHUB_OUTPUT"
          if [ "$ON_MAIN" = "false" ]; then
            echo "::notice::Tag is not on main or release/* — skipping release."
          fi

  ci:
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    uses: ./.github/workflows/ci.yml

  # Build the Windows release binary natively and hand it, unsigned, to
  # windows-sign. This job runs third-party build scripts, so it deliberately has
  # no id-token permission and never touches the signing credentials.
  windows-release-build:
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    env:
      # Line/module-level debug info so the shipped PDB supports symbolized backtraces.
      # On MSVC debug info is "packed" into the .pdb, so the .exe is unchanged.
      CARGO_PROFILE_RELEASE_DEBUG: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-msvc
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install cargo-auditable
        uses: taiki-e/install-action@47345a21ef01b2d0e9b59e2e41d51f17780e1b0d # cargo-auditable
        with:
          tool: cargo-auditable@0.7.6

      - name: Build Windows Release (cargo auditable)
        run: cargo auditable build --release --target x86_64-pc-windows-msvc -p miru-agent --locked

      - name: Stage prebuilt artifacts
        shell: pwsh
        run: |
          $out = "build\prebuilt\windows_amd64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\miru-agent.exe $out
          Copy-Item target\x86_64-pc-windows-msvc\release\miru_agent.pdb $out
          Get-ChildItem $out
          & "$out\miru-agent.exe" version

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-windows-amd64-msvc-unsigned
          path: build/prebuilt/windows_amd64/
          if-no-files-found: error

  # Authenticode-sign miru-agent.exe with Azure Artifact Signing, build the MSI
  # around the signed executable, then sign the MSI. The release job imports
  # only this job's output, so an unsigned Windows binary cannot be published.
  #
  # Azure login uses GitHub OIDC (no stored credential) against a federated
  # credential whose subject is this repository's `release` environment; restrict
  # that environment's deployment refs to v* tags. See
  # build/windows/README.md, "Code signing", for the Azure setup.
  windows-sign:
    needs: [check-main, windows-release-build]
    if: needs.check-main.outputs.on_main == 'true'
    # GitHub-hosted image: the signing action supports only GitHub's Windows
    # images, and windows-package already builds the MSI on one.
    runs-on: windows-2025
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      PREBUILT_DIR: ${{ github.workspace }}\build\prebuilt\windows_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download unsigned Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-windows-amd64-msvc-unsigned
          path: build/prebuilt/windows_amd64

      # Stable tags keep their version as the MSI version (v0.10.4 -> 0.10.4).
      # Prereleases add a fourth field that names the stage: alpha.N -> 1NN,
      # beta.N -> 2NN, rc.N -> 3NN (v0.10.4-beta.1 -> 0.10.4.201). Windows
      # Installer ignores the fourth field when comparing products, so the MSI
      # allows same-version upgrades (build/windows/miru-agent.wxs) and later
      # betas and the stable release replace a beta in place. The file name
      # keeps the tag's version: miru-agent-0.10.4-beta.1.msi.
      - name: Resolve MSI version
        id: msi
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $release = $env:REF_NAME -replace '^v', ''
          $stages = @{ alpha = 100; beta = 200; rc = 300 }
          if ($release -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            $version = $release
          } elseif ($release -match '^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)\.([1-9][0-9]?)$') {
            $version = '{0}.{1}' -f $Matches[1], ($stages[$Matches[2]] + [int]$Matches[3])
          } else {
            throw "No MSI version mapping for tag '$env:REF_NAME'. Expected vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N with N from 1 to 99."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "file=miru-agent-$release.msi" >> $env:GITHUB_OUTPUT
          Write-Host "Building miru-agent-$release.msi with MSI version $version"

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # `description` is signtool's /d: UAC shows it as the program name when the
      # MSI is launched, instead of the downloaded file's name.
      - name: Sign miru-agent.exe
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.PREBUILT_DIR }}\miru-agent.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Miru Agent
          description-url: https://mirurobotics.com
          # Authenticate only through the Azure CLI session from azure/login.
          exclude-environment-credential: true
          exclude-azure-powershell-credential: true

      - name: Restore pinned WiX SDK
        run: dotnet restore build/windows/miru-agent.wixproj

      # Same build arguments as the package tests (build/windows/tests/MsiTest.psm1,
      # Invoke-DotNetBuild), with BinDir pointing at the signed executable.
      - name: Build MSI
        shell: pwsh
        env:
          MSI_VERSION: ${{ steps.msi.outputs.version }}
          MSI_FILE: ${{ steps.msi.outputs.file }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'build\windows\artifacts\msi'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet build build\windows\miru-agent.wixproj --no-restore --configuration Release `
            -p:Platform=x64 "-p:Version=$env:MSI_VERSION" "-p:BinDir=$env:PREBUILT_DIR" `
            "-p:OutputPath=$out\" "-p:IntermediateOutputPath=$out\obj\"
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }
          $msi = Get-ChildItem -LiteralPath $out -Filter '*.msi' -File -Recurse |
            Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
          if ($null -eq $msi) { throw "No MSI was produced" }
          Copy-Item -LiteralPath $msi.FullName -Destination (Join-Path $env:PREBUILT_DIR $env:MSI_FILE)

      - name: Sign MSI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ env.PREBUILT_DIR }}\${{ steps.msi.outputs.file }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Miru Agent
          description-url: https://mirurobotics.com
          exclude-environment-credential: true
          exclude-azure-powershell-credential: true

      # Artifact Signing certificates are valid for only a few days, so a
      # signature without an RFC 3161 timestamp would stop verifying soon after
      # the release. Require both a valid chain and a timestamp.
      - name: Verify signatures
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath $env:PREBUILT_DIR -File |
            Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($files.Count -eq 0) { throw "No signable files in $env:PREBUILT_DIR" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($sig.Status -ne 'Valid') {
              throw "$($file.Name): signature status $($sig.Status): $($sig.StatusMessage)"
            }
            if ($null -eq $sig.TimeStamperCertificate) {
              throw "$($file.Name): signature is not timestamped"
            }
            Write-Host "$($file.Name): signed by $($sig.SignerCertificate.Subject)"
          }
          Get-ChildItem -LiteralPath $env:PREBUILT_DIR

      - name: Upload signed Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-windows-amd64-msvc
          path: build/prebuilt/windows_amd64/
          if-no-files-found: error

  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [ci, check-main, windows-sign]
    if: needs.check-main.outputs.on_main == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch the entire history so that we can correctly determine the previous tag
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download signed Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-windows-amd64-msvc
          path: build/prebuilt/windows_amd64

      - name: Show Windows prebuilt artifacts
        run: ls -l build/prebuilt/windows_amd64

      - name: Release
        run: ./build/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
