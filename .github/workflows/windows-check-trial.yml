# TEMPORARY: timing trial for windows-check (warm round 2). Never merged; the
# branch is deleted once the numbers are in.
name: Windows check trial

on:
  push:
    branches: ["ci/windows-check-trial"]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-trial:
    name: windows-trial (${{ matrix.vcpu }} vCPU, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        vcpu: [4, 8]
        # current: the windows-check steps as on main.
        # lean: no choco NASM (image NASM, prebuilt objects as fallback), no unused stable toolchain install.
        mode: [current, lean]
    runs-on: blacksmith-${{ matrix.vcpu }}vcpu-windows-2025
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      AWS_LC_SYS_PREBUILT_NASM: ${{ matrix.mode == 'lean' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        if: matrix.mode == 'current'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Time toolchain and metadata
        if: matrix.mode == 'lean'
        run: |
          "rustc -vV: {0:n1}s" -f (Measure-Command { rustc -vV | Out-Host }).TotalSeconds
          "cargo metadata: {0:n1}s" -f (Measure-Command { cargo metadata --format-version 1 --all-features | Out-Null }).TotalSeconds

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: trial2-${{ matrix.vcpu }}-${{ matrix.mode }}
          cache-on-failure: true
          env-vars: AWS_LC_SYS

      - name: Install NASM (aws-lc-sys)
        if: matrix.mode == 'current'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Show NASM on the image
        if: matrix.mode == 'lean'
        run: |
          Get-Command nasm -All -ErrorAction SilentlyContinue | Format-List Source, Version
          nasm -v

      - name: Run Windows Tests
        if: matrix.mode == 'current'
        env:
          RUST_LOG: "off"
        run: cargo test --package miru-agent --locked

      # A full cache hit already holds every crate and its index entry, so skip
      # the per-run sparse index refresh; fall back to the network otherwise.
      - name: Fetch crates
        if: matrix.mode == 'lean'
        run: |
          cargo fetch --locked --offline
          if ($LASTEXITCODE -ne 0) { cargo fetch --locked }

      - name: Run Windows Tests (offline)
        if: matrix.mode == 'lean'
        env:
          RUST_LOG: "off"
        run: cargo test --package miru-agent --frozen
