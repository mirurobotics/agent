# Runs the real-GCS upload tests (agent/tests/s3/gcs.rs). GCS uploads rely on
# aws-sdk-s3 behaviour Google doesn't document, and the worst break is silent,
# so changes to the SDK or the upload code are checked against real GCS.
#
# Authenticates with workload identity, set up by these repo variables:
#   GCS_IT_WIF_PROVIDER     the workload identity provider
#   GCS_IT_SERVICE_ACCOUNT  a service account with roles/storage.objectAdmin
#                           on the bucket
#   GCS_IT_BUCKET           the test bucket. The tests don't delete what they
#                           write, so give it a lifecycle rule that does.
#
# A run that can't authenticate, such as a fork PR's, skips the tests, unless
# the PR changes an aws-* crate: then it fails, and the workflow should be run
# by hand on that branch (Actions > GCS XML > Run workflow).
name: GCS XML

on:
  pull_request:
    branches: [main, "release/*"]
    paths:
      - Cargo.lock
      - agent/src/s3/**
      - agent/tests/s3/**
      - .github/workflows/gcs-xml.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gcs:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # GitHub sets ACTIONS_ID_TOKEN_REQUEST_URL only when the run can get the
      # OIDC token that workload identity needs.
      - name: Check for credentials
        id: creds
        env:
          CONFIGURED: ${{ vars.GCS_IT_WIF_PROVIDER != '' && vars.GCS_IT_SERVICE_ACCOUNT != '' && vars.GCS_IT_BUCKET != '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          aws_crates() { grep -A1 '^name = "aws-'; }
          if [ "$CONFIGURED" = true ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_SHA" ] && [ "$(git show "$BASE_SHA:Cargo.lock" | aws_crates)" != "$(aws_crates < Cargo.lock)" ]; then
            echo "::error::This PR changes aws-* crates but this run can't reach GCS. Run the GCS XML workflow by hand on this branch before merging."
            exit 1
          else
            echo "::notice::No GCS credentials in this run; skipping the real-GCS tests"
          fi

      - name: Install Rust Toolchain
        if: steps.creds.outputs.ok == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        if: steps.creds.outputs.ok == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.creds.outputs.ok == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCS_IT_WIF_PROVIDER }}
          service_account: ${{ vars.GCS_IT_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Run the real-GCS tests
        if: steps.creds.outputs.ok == 'true'
        env:
          GCS_IT_SOURCE_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCS_IT_BUCKET: ${{ vars.GCS_IT_BUCKET }}
        run: cargo test --package miru-agent --locked --test mod s3::gcs
