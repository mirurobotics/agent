name: PR Description

on:
  pull_request:
    branches: [main, "release/*"]
    types: [opened, edited, synchronize, reopened]
  # Lets the check be required: the job skips (passes) in the merge queue.
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-description:
    uses: mirurobotics/workflows/.github/workflows/pr-description.yml@7f73016946866f04e6152f27276711549474e2f8
