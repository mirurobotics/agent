name: CodeQL

on:
  push:
    branches: ["release/*"]
  schedule:
    - cron: '31 7 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  changes:
    name: Check for new commits
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
      # The nightly run skips the scan when main hasn't moved since the last
      # successful run, so quiet repos don't rescan the same commit.
      - name: Check for commits since the last scan
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          scan=true
          if [ "$EVENT" = "schedule" ]; then
            workflow_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq .workflow_id) || true
            runs="repos/$REPO/actions/workflows/$workflow_id/runs"
            last_sha=$(gh api "$runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || true
            if [ -n "$last_sha" ] && [ "$last_sha" = "$SHA" ]; then
              echo "main is still at $SHA, which was already scanned."
              scan=false
            fi
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"

  codeql:
    needs: changes
    if: needs.changes.outputs.scan == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: rust

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
