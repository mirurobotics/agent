name: CodeQL

on:
  push:
    branches: ["release/*"]
  schedule:
    - cron: '31 7 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  changes:
    name: Check for new commits
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
      # The nightly run skips the scan when main hasn't moved since the last
      # successful run, so quiet repos don't rescan the same commit.
      - name: Check for commits since the last scan
        id: check
        uses: mirurobotics/.github/actions/codeql-gate@d2aec010e6ce5c9dd65fb16e6d06a0f61e437734 # main

  codeql:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scan != 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: rust

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
