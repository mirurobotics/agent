name: CI

on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: ["release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main

      - name: Install Linters
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet

      - name: Run Linter
        run: LINT_FIX=0 ./scripts/lint.sh

  windows-check:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    # No toolchain or NASM install steps on the Windows jobs. rustup installs
    # the toolchain pinned in rust-toolchain.toml on first use (an install of
    # `stable` would go unused), and the runner image already has NASM on
    # PATH. If NASM ever leaves the image, AWS_LC_SYS_PREBUILT_NASM lets
    # aws-lc-sys link its prebuilt objects instead of failing. rust-cache
    # hashes it (env-vars) because aws-lc-sys rebuilds when it changes.
    env:
      # Full PDBs dominate MSVC link time; test diagnostics do not need them.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The cache saved by the former check-only job never held the
          # host-target test artifacts; a new key lets this job save its own.
          key: test-suite
          cache-on-failure: true
          env-vars: AWS_LC_SYS

      - name: Run Windows Tests
        env:
          RUST_LOG: "off"
        run: cargo test --package miru-agent --locked

  windows_package_scope:
    name: windows-package-scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows_package: ${{ github.event_name != 'pull_request' || steps.filter.outputs.package == 'true' }}
    steps:
      - name: Classify changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            package:
              - 'build/windows/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  # Build the exe the package tests install on a Blacksmith runner, where the
  # compile is several times faster than on windows-latest. Release profile: a
  # dev exe is much larger, which roughly doubled every MSI build in CI.
  windows-agent-build:
    needs: windows_package_scope
    if: needs.windows_package_scope.outputs.windows_package == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    # Toolchain and NASM: see windows-check.
    env:
      CARGO_INCREMENTAL: 0
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msi-release
          cache-on-failure: true
          env-vars: AWS_LC_SYS

      - name: Build Windows Target
        run: cargo build --target x86_64-pc-windows-msvc --package miru-agent --bin miru-agent --locked --release

      - name: Upload agent executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-windows-agent-exe
          path: target/x86_64-pc-windows-msvc/release/miru-agent.exe
          if-no-files-found: error
          retention-days: 1

  # The integration tests stay on windows-latest: their non-admin probe uses
  # Start-Process -Credential, which fails in Blacksmith's session 0.
  windows-package:
    needs: [windows_package_scope, windows-agent-build]
    if: needs.windows_package_scope.outputs.windows_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download agent executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-windows-agent-exe
          path: target/x86_64-pc-windows-msvc/release

      - name: Restore pinned WiX SDK
        run: build\windows\restore-pinned.ps1 -ProjectPath build\windows\miru-agent.wixproj

      - name: Run package tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\package-tests.ps1 -ProjectPath build\windows\miru-agent.wixproj -BinDir target\x86_64-pc-windows-msvc\release -ArtifactsDirectory build\windows\artifacts\package-tests

      - name: Run integration tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\integration-tests.ps1 -Configuration Release -ConfirmDisposableTestMachine

      - name: Upload Windows installer failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-failure-logs
          path: build/windows/artifacts/package-tests/logs
          if-no-files-found: ignore

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Tests and Coverage Gates
        run: ./scripts/covgate.sh

  tools:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@3be4ad2b146f3302f92e5956c54fedbb6ae8cccc # main

      - name: Install Tools
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet
          sudo apt-get install -y jq

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Linter
        run: LINT_FIX=0 ./tools/lint/scripts/lint.sh

      - name: Run Tests + Coverage Gate
        run: ./tools/lint/scripts/covgate.sh

  debian-package:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }

      - name: Lint maintainer scripts
        run: |
          shellcheck -s sh build/debian/postinst build/debian/postrm
          shellcheck build/debian/tests/postinst-test.sh

      - name: Run postinst container test
        run: build/debian/tests/postinst-test.sh
