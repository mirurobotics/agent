name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Linters
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet

      - name: Run Linter
        run: LINT_FIX=0 ./scripts/lint.sh

  windows-check:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    env:
      # Full PDBs dominate MSVC link time; test diagnostics do not need them.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The cache saved by the former check-only job never held the
          # host-target test artifacts; a new key lets this job save its own.
          key: test-suite
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Run Windows Tests
        env:
          RUST_LOG: "off"
        run: cargo test --package miru-agent --locked

  windows_package_scope:
    name: windows-package-scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows_package: ${{ github.event_name != 'pull_request' || steps.filter.outputs.package == 'true' }}
      windows_release: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release == 'true' }}
    steps:
      - name: Classify changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            package:
              - 'build/windows/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            release:
              - 'build/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'

  windows-package:
    needs: windows_package_scope
    if: needs.windows_package_scope.outputs.windows_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msi
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build Windows Target
        run: cargo build --target x86_64-pc-windows-msvc --package miru-agent --locked --release

      - name: Restore pinned WiX SDK
        run: dotnet restore build/windows/miru-agent.wixproj

      - name: Run package tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\package-tests.ps1 -ProjectPath build\windows\miru-agent.wixproj -BinDir target\x86_64-pc-windows-msvc\release -ArtifactsDirectory build\windows\artifacts\package-tests

      - name: Run integration tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\integration-tests.ps1 -Configuration Release -ConfirmDisposableTestMachine

      - name: Upload Windows installer failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-failure-logs
          path: build/windows/artifacts/package-tests/logs
          if-no-files-found: ignore

  windows-release-build:
    needs: windows_package_scope
    if: needs.windows_package_scope.outputs.windows_release == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 45
    env:
      # Line/module-level debug info so the shipped PDB supports symbolized
      # backtraces. On MSVC debug info is "packed" into the .pdb, so the .exe
      # is unchanged. Job-scoped on purpose: the Linux lane keeps
      # [profile.release] debug = false from Cargo.toml.
      CARGO_PROFILE_RELEASE_DEBUG: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-msvc
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install cargo-auditable
        uses: taiki-e/install-action@47345a21ef01b2d0e9b59e2e41d51f17780e1b0d # cargo-auditable
        with:
          tool: cargo-auditable@0.7.6

      - name: Build Windows Release (cargo auditable)
        run: cargo auditable build --release --target x86_64-pc-windows-msvc -p miru-agent --locked

      - name: Stage prebuilt artifacts
        shell: pwsh
        run: |
          $out = "build\prebuilt\windows_amd64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\miru-agent.exe $out
          Copy-Item target\x86_64-pc-windows-msvc\release\miru_agent.pdb $out
          Get-ChildItem $out
          & "$out\miru-agent.exe" version

      - name: Upload prebuilt artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-windows-amd64-msvc
          path: build/prebuilt/windows_amd64/
          if-no-files-found: error

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Tests and Coverage Gates
        run: ./scripts/covgate.sh

  tools:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Tools
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet
          sudo apt-get install -y jq

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Linter
        run: LINT_FIX=0 ./tools/lint/scripts/lint.sh

      - name: Run Tests + Coverage Gate
        run: ./tools/lint/scripts/covgate.sh
