name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Linters
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet

      - name: Run Linter
        run: LINT_FIX=0 ./scripts/lint.sh

  windows-check:
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60
    env:
      # Full PDBs dominate MSVC link time; test diagnostics do not need them.
      CARGO_PROFILE_DEV_DEBUG: 0
      # Link the five test binaries with rust-lld (ships in every MSVC
      # toolchain; rustc puts its directory on the linker's PATH and infers
      # the lld-link flavor from the file stem). Job-level on purpose: the
      # CARGO prefix puts it in rust-cache's key, so artifacts from the two
      # linkers never share a cache.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The suites are bound by per-file-operation latency on NTFS. A ReFS
      # Dev Drive skips most filesystem filter drivers. Mounting it at
      # `target` keeps rust-cache and every cargo command unchanged, and
      # routing TEMP/TMP onto it moves every tempfile fixture there. Done
      # inline (same cmdlets as samypr100/setup-dev-drive) because the
      # repo's Actions allowlist does not include that action. The VHD is
      # never dismounted: rust-cache's post step saves `target` from the
      # still-mounted drive and the runner is discarded afterwards.
      - name: Create Dev Drive (ReFS) for target and temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mount = Join-Path $env:GITHUB_WORKSPACE 'target'
          New-Item -ItemType Directory -Force $mount | Out-Null
          $part = New-VHD -Path 'D:\dev_drive.vhdx' -SizeBytes 12GB -Dynamic |
            Mount-VHD -NoDriveLetter -PassThru |
            Initialize-Disk -PassThru |
            New-Partition -UseMaximumSize
          $part | Format-Volume -DevDrive -Confirm:$false -Force | Out-Null
          $part | Add-PartitionAccessPath -AccessPath $mount | Out-Null
          $tmp = Join-Path $mount 'tmp'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          "TEMP=$tmp" >> $env:GITHUB_ENV
          "TMP=$tmp" >> $env:GITHUB_ENV
          $part | Get-Volume | Select-Object FileSystemType, Size, SizeRemaining | Format-List | Out-String
          fsutil devdrv query $mount

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The cache saved by the former check-only job never held the
          # host-target test artifacts; a new key lets this job save its own.
          key: test-suite
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Probe Runner
        shell: pwsh
        run: |
          # Pipe each table through Out-String; pwsh otherwise defers
          # formatting and drops later tables of a different object type.
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List | Out-String
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath | Format-List | Out-String
          "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"
          "TEMP=$env:TEMP"
          "RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-PSDrive C, D | Select-Object Name, Used, Free | Format-Table -AutoSize | Out-String

      # One cargo invocation on purpose: agent/build.rs re-runs on every
      # invocation (its rerun-if-changed paths are relative to the package
      # dir), so a separate --no-run step would rebuild miru-agent twice.
      # Compile time is the `Finished` line's timestamp minus the step start;
      # --timings records per-crate compile durations for the artifact below.
      - name: Run Windows Tests
        env:
          RUST_LOG: "off"
        run: cargo test --package miru-agent --locked --timings

      - name: Upload Cargo Timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  windows_package_scope:
    name: windows-package-scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows_package: ${{ github.event_name != 'pull_request' || steps.filter.outputs.package == 'true' }}
    steps:
      - name: Classify changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            package:
              - 'build/windows/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  windows-package:
    needs: windows_package_scope
    if: needs.windows_package_scope.outputs.windows_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msi
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build Windows Target
        run: cargo build --target x86_64-pc-windows-msvc --package miru-agent --locked --release

      - name: Restore pinned WiX SDK
        run: dotnet restore build/windows/miru-agent.wixproj

      - name: Run package tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\package-tests.ps1 -ProjectPath build\windows\miru-agent.wixproj -BinDir target\x86_64-pc-windows-msvc\release -ArtifactsDirectory build\windows\artifacts\package-tests

      - name: Run integration tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\integration-tests.ps1 -Configuration Release -ConfirmDisposableTestMachine

      - name: Upload Windows installer failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-failure-logs
          path: build/windows/artifacts/package-tests/logs
          if-no-files-found: ignore

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Tests and Coverage Gates
        run: ./scripts/covgate.sh

  tools:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Tools
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet
          sudo apt-get install -y jq

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Linter
        run: LINT_FIX=0 ./tools/lint/scripts/lint.sh

      - name: Run Tests + Coverage Gate
        run: ./tools/lint/scripts/covgate.sh
