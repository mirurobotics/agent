name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Linters
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet

      - name: Run Linter
        run: LINT_FIX=0 ./scripts/lint.sh

  windows_scope:
    name: windows-scope
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows_compile: ${{ steps.scope.outputs.windows_compile }}
      windows_package: ${{ steps.scope.outputs.windows_package }}
    steps:
      - name: Classify changes
        id: scope
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('windows_compile', true)
              core.setOutput('windows_package', true)
              return
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            })
            const paths = files.flatMap(({ filename, previous_filename }) =>
              [filename, previous_filename].filter(Boolean))
            const workflowFiles = new Set([
              '.github/workflows/ci.yml',
              '.github/workflows/release.yml',
            ])
            const isPackageInput = (path) =>
              workflowFiles.has(path) || path.startsWith('build/windows/')
            const isCompileInput = (path) =>
              isPackageInput(path) ||
              ['Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml'].includes(path) ||
              ['.cargo/', 'agent/', 'libs/'].some((prefix) => path.startsWith(prefix))

            core.setOutput('windows_compile', paths.some(isCompileInput))
            core.setOutput('windows_package', paths.some(isPackageInput))

  # Compile Windows-affecting pull requests and run the complete MSI lifecycle
  # for package changes, protected branches, and release workflow calls.
  # aws-lc-sys requires a native Windows host compiler.
  windows-check:
    needs: windows_scope
    if: needs.windows_scope.outputs.windows_compile == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Check Windows Target
        if: needs.windows_scope.outputs.windows_package != 'true'
        run: cargo check --target x86_64-pc-windows-msvc --package miru-agent --locked

      - name: Build Windows Target
        if: needs.windows_scope.outputs.windows_package == 'true'
        run: cargo build --target x86_64-pc-windows-msvc --package miru-agent --locked --release

      - name: Restore pinned WiX SDK
        if: needs.windows_scope.outputs.windows_package == 'true'
        run: dotnet restore build/windows/miru-agent.wixproj

      - name: Validate Windows packages
        if: needs.windows_scope.outputs.windows_package == 'true'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\package-tests.ps1 -ProjectPath build\windows\miru-agent.wixproj -BinDir target\x86_64-pc-windows-msvc\release -ArtifactsDirectory build\windows\artifacts\package-tests

      - name: Run elevated Windows installer integration tests
        if: needs.windows_scope.outputs.windows_package == 'true'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File build\windows\tests\integration-tests.ps1 -Configuration Release -ConfirmDisposableTestMachine

      - name: Upload Windows installer failure logs
        if: failure() && needs.windows_scope.outputs.windows_package == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-failure-logs
          path: build/windows/artifacts/package-tests/logs
          if-no-files-found: ignore

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Tests and Coverage
        run: ./scripts/covgate.sh

  tools:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Windows workflow contracts
        run: node --test build/windows/tests/workflow-tests.test.mjs

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Tools
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet
          sudo apt-get install -y jq

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Linter
        run: LINT_FIX=0 ./tools/lint/scripts/lint.sh

      - name: Run Tests + Coverage Gate
        run: ./tools/lint/scripts/covgate.sh
