name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Linters
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet

      - name: Run Linter
        run: LINT_FIX=0 ./scripts/lint.sh

  # Run the agent test suite natively on Windows. A native runner is required
  # because aws-lc-sys cannot cross-compile from Linux (its build script drives
  # the host C compiler with pthread-based sources). `cargo test` type-checks
  # lib, bin and tests for the host MSVC target, so no separate check step is
  # needed. Coverage gates stay Linux-only. The job id is kept as
  # `windows-check` for branch protection.
  windows-check:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Full PDBs dominate MSVC link time; test diagnostics do not need them.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The suites are bound by per-file-operation latency on NTFS. A ReFS
      # Dev Drive skips most filesystem filter drivers. Mounting it at
      # `target` keeps rust-cache and every cargo command unchanged, and
      # routing TEMP/TMP onto it moves every tempfile fixture there. This
      # step precedes rust-cache so the cache's post-step save runs before
      # this action's post-step dismounts the drive.
      - name: Create Dev Drive (ReFS) for target and temp
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
        with:
          drive-size: 12GB
          drive-format: ReFS
          drive-type: Dynamic
          drive-path: D:\dev_drive.vhdx
          mount-path: ${{ github.workspace }}\target
          env-mapping: |
            TEMP,{{ DEV_DRIVE }}\tmp
            TMP,{{ DEV_DRIVE }}\tmp

      - name: Create temp directory on the Dev Drive
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:TEMP | Out-Null

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The cache saved by the former check-only job never held the
          # host-target test artifacts; a new key lets this job save its own.
          key: test-suite
          cache-on-failure: true

      - name: Install NASM (aws-lc-sys)
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Probe Runner
        shell: pwsh
        run: |
          # Pipe each table through Out-String; pwsh otherwise defers
          # formatting and drops later tables of a different object type.
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List | Out-String
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath | Format-List | Out-String
          "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"
          "TEMP=$env:TEMP"
          "RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-PSDrive C, D | Select-Object Name, Used, Free | Format-Table -AutoSize | Out-String

      # One cargo invocation on purpose: agent/build.rs re-runs on every
      # invocation (its rerun-if-changed paths are relative to the package
      # dir), so a separate --no-run step would rebuild miru-agent twice.
      # Compile time is the `Finished` line's timestamp minus the step start;
      # --timings records per-crate compile durations for the artifact below.
      - name: Run Windows Tests
        env:
          RUST_LOG: "off"
        run: cargo test --package miru-agent --locked --timings

      - name: Upload Cargo Timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-cargo-timings
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Tests and Coverage Gates
        run: ./scripts/covgate.sh

  tools:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # main

      - name: Install Tools
        run: |
          cargo binstall --force --no-confirm cargo-machete cargo-audit cargo-diet
          sudo apt-get install -y jq

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov

      - name: Run Linter
        run: LINT_FIX=0 ./tools/lint/scripts/lint.sh

      - name: Run Tests + Coverage Gate
        run: ./tools/lint/scripts/covgate.sh
