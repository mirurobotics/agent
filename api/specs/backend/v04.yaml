    ReprovisionDeviceRequest:
      title: Reprovision Device Request
      type: object
      description: 'Reprovision an existing device. Reprovisioning rebinds the device record to the calling physical machine: it invalidates any prior session, registers the new public key, and triggers a redeploy of the device''s current deployment. Deployment history is preserved across the swap. The device''s name is not provided here because the target device record already has a name; the device is identified by the provisioning token.'
      required:
        - public_key_pem
        - agent_version
      properties:
        public_key_pem:
          type: string
          description: The public key in PEM format.
          example: |
            -----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAjVb+KEVBPIGDulBAuAUL\nT8PMvLW+VZ8aZ5p63/uHxM15fSPGnWZ4YtRHVed9gVRufrld3Pei7lP1LB88x6T0\nOPIQjMVXtx87bYSFFSrjqNg9yDUn17HDg7afehXoFuFi/q2QtTBKgOZqnPTRVHEM\nJqVjGCGb70AzpbcS6kdmlGjQY1R9uLbn8hREY+bUq5qgsnC2xfp5iioSYK8bkIUH\nexGybOcSLO21YIIsWoysBPppc1qqSo46L/xK+YjYkdMi3Qt0I07lS6FQk4lbUr6h\nHqRyCVEfUgqX4zy2ba0PHNImokltQfwrljfCZ/odCazCvqbrNptreQLoNVtN7NA4\nYQIDAQAB\n-----END PUBLIC KEY-----
