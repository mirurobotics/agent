    InstanceFormat:
      title: Instance Format
      type: string
      description: 'The on-disk format used when a config instance is written to the
        device filesystem.

        - `json`: standard JSON.

        - `yaml`: YAML 1.2.

        - `jsonc`: JSON with comments (JSON plus `//` and `/* */` comment syntax).

        '
      enum:
      - json
      - yaml
      - jsonc
      x-enum-varnames:
