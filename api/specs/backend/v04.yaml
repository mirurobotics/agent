      required:
      - object
      - id
      - device_id
      - upload_rule_id
      - upload_collection_name
      - source
      - destination
      - digest
      - size
      - status
      - incomplete
      - release_id
      - deployment_id
      - uploaded_at
      - created_at
      - updated_at
      - workspace_id
      properties:
        object:
          type: string
          enum:
          - upload
          example: upload
          x-stainless-const: true
          description: The object type, which is always `upload`.
        id:
          type: string
          example: upl_123
          description: ID of the upload.
        device_id:
          type: string
          example: dvc_123
          description: ID of the device that produced the upload.
        upload_rule_id:
          type: string
          example: upl_rule_123
          description: ID of the upload rule that produced the upload.
        upload_collection_name:
          type: string
          example: Robot Logs
          description: The name of the upload collection the producing upload rule
            belongs to.
        source:
          allOf:
          - $ref: '#/components/schemas/UploadSource'
          description: Source-side details of the file on the device that produced
