openapi: 3.0.3
info:
  title: Miru Agent API
  description: The API between the Miru Backend and the Agent; for internal use only
  version: v0.5.0-pre
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-release-version: v0.5.0-pre
  x-git-commit:
    sha: 4c92b71aa5ae84733ff799b9afc6ee975052c8a4
    url: https://github.com/mirurobotics/openapi/commit/4c92b71aa5ae84733ff799b9afc6ee975052c8a4
    message: 'feat(uploads): add upload_collection parent resource, re-parent upload rules (#144)'
servers:
  - url: https://staging.api.mirurobotics.com/agent/v1
    description: Staging
  - url: https://uat.api.mirurobotics.com/agent/v1
    description: UAT
  - url: https://api.mirurobotics.com/agent/v1
    description: Production
security:
  - DeviceSessionToken: []
paths:
  /version:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Version
      summary: Get
      description: Retrieve the version information of the application.
      operationId: getVersion
      responses:
        '200':
          description: Successfully retrieved the release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /config_instances/{config_instance_id}/content:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Config Instances
      summary: Download Content
      description: Download the content of a config instance.
      operationId: getConfigInstanceContent
      parameters:
        - $ref: '#/components/parameters/config_instance_id'
        - $ref: '#/components/parameters/disposition'
      responses:
        '200':
          description: Successfully retrieved the config instance content. The Content-Type header is set according to the instance format.
          headers:
            Content-Disposition:
              description: Header indicating whether the file is returned inline or as an attachment.
              schema:
                type: string
                example: inline
            Content-Type:
              description: The MIME type of the instance content.
              schema:
                type: string
                example: application/json
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: The raw config instance content.
  /deployments:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Deployments
      summary: List
      operationId: listDeployments
      description: List all deployments.
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/deployment_list_expansions'
        - $ref: '#/components/parameters/deployment_search_activity_status'
      responses:
        '200':
          description: Successfully listed the deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentList'
  /deployments/{deployment_id}:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Deployments
      summary: Get
      operationId: getDeployment
      description: Retrieve a deployment by its ID.
      parameters:
        - $ref: '#/components/parameters/deployment_id'
      responses:
        '200':
          description: Successfully retrieved the deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
    patch:
      tags:
        - Deployments
      summary: Update
      operationId: updateDeployment
      description: Update a deployment.
      parameters:
        - $ref: '#/components/parameters/deployment_id'
        - $ref: '#/components/parameters/deployment_expansions'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentRequest'
      responses:
        '200':
          description: Successfully updated the deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
  /releases/{release_id}:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Releases
      summary: Get
      operationId: getRelease
      description: Retrieve a release by its ID.
      parameters:
        - $ref: '#/components/parameters/release_id'
      responses:
        '200':
          description: Successfully retrieved the release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /upload_rules:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Upload Rules
      summary: List
      operationId: getUploadRules
      description: List the upload rules in the authenticated device's currently-deployed release.
      responses:
        '200':
          description: Successfully retrieved the upload rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadRuleList'
  /uploads:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
        - Uploads
      summary: Create
      operationId: createUpload
      description: |
        Request an upload for a captured file. The backend verifies the calling
        device from its session token, creates a ledger entry, and returns a
        short-lived V4-presigned URL the device PUTs the file to. The device's
        identity is derived from the token and is never read from the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '200':
          description: Successfully created the upload and minted a presigned URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUpload'
  /uploads/{upload_id}/confirm:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
        - Uploads
      summary: Confirm
      operationId: confirmUpload
      description: Confirm that the device durably wrote the upload to the destination bucket.
      parameters:
        - $ref: '#/components/parameters/upload_id'
      responses:
        '200':
          description: Successfully confirmed the upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
  /git_commits/{git_commit_id}:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Git Commits
      summary: Get
      operationId: getGitCommit
      description: Retrieve a git commit by its ID.
      parameters:
        - $ref: '#/components/parameters/git_commit_id'
      responses:
        '200':
          description: Successfully retrieved the git commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommit'
  /device:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - Devices
      summary: Get Self
      operationId: getDeviceSelf
      description: |
        Retrieve the calling device's own record. The device is identified by the bearer session token from the `DeviceSessionToken` security scheme.
      responses:
        '200':
          description: Successfully retrieved the calling device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    patch:
      tags:
        - Devices
      summary: Update
      operationId: updateDeviceByAgent
      description: Update a device from the agent.
      parameters:
        - $ref: '#/components/parameters/device_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceFromAgentRequest'
      responses:
        '200':
          description: Successfully updated the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/provision:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
        - Devices
      summary: Provision
      operationId: provisionDevice
      security:
        - ProvisioningToken: []
      description: Provision a device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionDeviceRequest'
      responses:
        '200':
          description: Successfully provisioned the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/reprovision:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
        - Devices
      summary: Reprovision
      operationId: reprovisionDevice
      security:
        - ProvisioningToken: []
      description: |
        Reprovision an existing device — rebind the device record to the calling physical machine. Invalidates any prior session, registers the new public key from the request body, and triggers a redeploy of the device's current deployment. Deployment history is preserved across the swap. The target device is identified by the provisioning token, not by name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprovisionDeviceRequest'
      responses:
        '200':
          description: Successfully reprovisioned the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/token:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
        - Devices
      summary: Issue Token
      operationId: issueDeviceToken
      security:
        - DeviceKeyJWT: []
      description: |
        Issue a device session token. The device authenticates by sending an `Authorization: Bearer <jwt>` header carrying a JWT it has self-signed with its own RSA private key (already enrolled at provisioning time via `public_key_pem`). The server reads the JWT header's `kid` parameter, looks up the device whose registered public-key fingerprint equals `kid`, and verifies the JWT signature against that stored public key. `kid` is a lookup hint only — the security boundary is "the signature verifies against the stored public key for the device with this fingerprint".

        Public-key fingerprint: the input is the device's registered RSA public key. Serialize it as DER-encoded `SubjectPublicKeyInfo` (PKIX SPKI, RFC 5280 §4.1 — the same byte sequence that `-----BEGIN PUBLIC KEY-----` PEM decodes to), SHA-256 the bytes, and lowercase-hex encode the digest. The result is exactly 64 hex characters.

        JWT contract:
        - Header MUST contain `alg: RS512` (RSA-PKCS1-v1_5 with SHA-512).
        - Header MUST contain `kid` (the 64-character lowercase hex public-key fingerprint).
        - Header MUST NOT embed the public key as a JWT header parameter. Servers MAY reject the request if such an embedded-key header parameter is present.
        - Payload MUST contain `jti` (unique per request, used for replay protection), `iat` (issued-at, RFC 7519 numeric date), and `exp` (expiration, RFC 7519 numeric date). Lifetime is 2 minutes (`exp = iat + 120`).
        - Signing input is `base64url(header) . base64url(payload)` per RFC 7515 §5.1.
      responses:
        '200':
          description: Successfully issued the device token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /cmd/devices/{device_id}/sync:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - MQTT
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            example: dvc_123
      summary: Sync
      operationId: syncDevice
      description: Send a sync command to a device.
      responses:
        '200':
          description: Triggered a device sync.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDevice'
  /cmd/devices/{device_id}/ping:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - MQTT
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            example: dvc_123
      summary: Ping
      operationId: pingDevice
      description: Send a ping command to a device.
      responses:
        '200':
          description: Ping a device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
  /resp/devices/{device_id}/pong:
    parameters:
      - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
        - MQTT
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            example: dvc_123
      summary: Pong
      operationId: devicePong
      description: Receive a pong response from a device.
      responses:
        '200':
          description: Ping response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
components:
  securitySchemes:
    DeviceSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Server-issued device session token. Obtained by the device from `POST /devices/token` (defined in this spec) using its `DeviceKeyJWT` bootstrap credential, then sent as `Authorization: Bearer <token>` on every other agent endpoint. The token identifies the calling device to the backend.
    DeviceKeyJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Device-self-signed JWT used to bootstrap a session token. The device signs a JWT with its own RSA private key; the server identifies the device by reading the `kid` header (the SHA-256 fingerprint of the device's registered public key, as DER-encoded SubjectPublicKeyInfo, lowercase hex) and verifies the JWT signature against the stored public key for that device. See `POST /devices/token` for the full JWT contract.
    ProvisioningToken:
      type: http
      scheme: bearer
      description: |
        Short-lived (5-minute) provisioning token used to bootstrap a device's identity on `POST /devices/provision` and `POST /devices/reprovision`. Minted from the Miru dashboard (programmatic minting via the Platform API is forthcoming) and sent as `Authorization: Bearer <token>`. A provisioning token may be either device-bound (issued for a specific pre-created device record, used by the dashboard activate/reprovision flow) or workspace-bound (used for bulk provisioning, where the target device is selected or created by `name` in the request body).
  schemas:
    APIVersion:
      type: string
      enum:
        - v0.5.0-pre
      x-enum-varnames:
        - API_VERSION
      x-stainless-const: true
    ReleaseVersion:
      type: string
      enum:
        - $RELEASE_VERSION$
      x-enum-varnames:
        - RELEASE_VERSION
      x-stainless-const: true
    APIGitCommit:
      type: string
      enum:
        - $API_GIT_COMMIT$
      x-enum-varnames:
        - API_GIT_COMMIT
      x-stainless-const: true
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    DplSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
        - activity_status
      x-enum-varnames:
        - DPL_SEARCH_ACTIVITY_STATUS
    Version:
      title: Version
      type: object
      required:
        - version
        - git_commit
        - api_version
        - api_git_commit
        - api_release_version
        - go_version
        - build_date
        - os
        - arch
      properties:
        version:
          type: string
          description: The version of the application.
          example: v1.0.0
        git_commit:
          type: string
          description: The git commit of the application.
          example: a1b2c3d4
        api_version:
          type: string
          description: The API version of the application.
          example: 2026-02-24.zion
        api_git_commit:
          type: string
          description: The git commit of the API.
          example: a1b2c3d4
        api_release_version:
          type: string
          description: The API release version of the application.
          example: 2026-02-24.yukon-beta.1
        go_version:
          type: string
          description: The version of Go.
          example: go1.20.0
        build_date:
          type: string
          format: date-time
          description: The build date of the application.
          example: '2025-01-01T00:00:00Z'
        os:
          type: string
          description: The operating system of the application.
          example: linux
        arch:
          type: string
          description: The architecture of the application.
          example: aarch64
      example:
        version: v1.0.0
        git_commit: a1b2c3d4
        api_version: 2026-02-24.zion
        api_git_commit: a1b2c3d4
        api_release_version: 2026-02-24.yukon-beta.1
        go_version: go1.20.0
        build_date: '2025-01-01T00:00:00Z'
        os: linux
        arch: aarch64
    DeploymentListExpansion:
      type: string
      enum:
        - total_count
        - release
        - config_instances
      x-enum-varnames:
        - DEPLOYMENT_LIST_EXPAND_TOTAL_COUNT
        - DEPLOYMENT_LIST_EXPAND_RELEASE
        - DEPLOYMENT_LIST_EXPAND_CONFIG_INSTANCES
    DeploymentActivityStatus:
      type: string
      description: |
        Last known activity state of the deployment.

        `drifted` means the device's configurations have drifted since this deployment was staged, and the deployment needs to be reviewed before it can be deployed.

        `staged` means the deployment is ready to be deployed.

        `queued` means the deployment's config instances are waiting to be received by the device and will be deployed as soon as the device is online.

        `deployed` means the deployment's config instances are currently available for consumption on the device.

        `removing` means the deployment's config instances are being removed from the device.

        `archived` means the deployment is available for historical reference but cannot be deployed and is not active on the device.
      enum:
        - drifted
        - staged
        - queued
        - deployed
        - removing
        - archived
      x-enum-varnames:
        - DEPLOYMENT_ACTIVITY_STATUS_DRIFTED
        - DEPLOYMENT_ACTIVITY_STATUS_STAGED
        - DEPLOYMENT_ACTIVITY_STATUS_QUEUED
        - DEPLOYMENT_ACTIVITY_STATUS_DEPLOYED
        - DEPLOYMENT_ACTIVITY_STATUS_REMOVING
        - DEPLOYMENT_ACTIVITY_STATUS_ARCHIVED
    PaginatedList:
      title: Paginated List
      type: object
      required:
        - object
        - limit
        - offset
        - has_more
      properties:
        object:
          type: string
          enum:
            - list
          example: list
          x-stainless-const: true
          description: The object type, which is always `list`.
        total_count:
          type: integer
          format: int64
          description: The total number of items in the list. By default the total count is not returned. The total count must be expanded (using expand=total_count) to get the total number of items in the list.
        limit:
          type: integer
          description: The maximum number of items to return. A limit of 15 with an offset of 0 returns items 1-15.
          default: 10
          minimum: 1
          maximum: 100
        offset:
          type: integer
          description: The offset of the items to return. An offset of 10 with a limit of 10 returns items 11-20.
          default: 0
          minimum: 0
        has_more:
          type: boolean
          description: True if there are more items in the list to return. False if there are no more items to return.
          example: false
    DeploymentStatus:
      type: string
      description: |
        This status merges the 'activity_status' and 'error_status' fields, with error states taking precedence over activity states when errors are present. For example, if the activity status is 'deployed' but the error status is 'failed', the status is 'failed'. However, if the error status is 'none' and the activity status is 'deployed', the status is 'deployed'.
      enum:
        - drifted
        - staged
        - queued
        - deployed
        - removing
        - archived
        - failed
        - retrying
      x-enum-varnames:
        - DEPLOYMENT_STATUS_DRIFTED
        - DEPLOYMENT_STATUS_STAGED
        - DEPLOYMENT_STATUS_QUEUED
        - DEPLOYMENT_STATUS_DEPLOYED
        - DEPLOYMENT_STATUS_REMOVING
        - DEPLOYMENT_STATUS_ARCHIVED
        - DEPLOYMENT_STATUS_FAILED
        - DEPLOYMENT_STATUS_RETRYING
    DeploymentErrorStatus:
      type: string
      description: |
        Last known error state of the deployment.

        `none` means there are no errors.

        `retrying` means an error has been encountered and the agent is retrying to reach the target status.

        `failed` means a fatal error has been encountered; the deployment is archived and, if deployed, removed from the device.
      enum:
        - none
        - failed
        - retrying
      x-enum-varnames:
        - DEPLOYMENT_ERROR_STATUS_NONE
        - DEPLOYMENT_ERROR_STATUS_FAILED
        - DEPLOYMENT_ERROR_STATUS_RETRYING
    DeploymentTargetStatus:
      type: string
      description: |
        Desired state of the deployment.

        `staged` means the deployment is ready to be deployed.

        `deployed` means all config instances in the deployment are available for consumption on the device.

        `archived` means the deployment is available for historical reference but cannot be deployed and is not active on the device.
      enum:
        - staged
        - deployed
        - archived
      x-enum-varnames:
        - DEPLOYMENT_TARGET_STATUS_STAGED
        - DEPLOYMENT_TARGET_STATUS_DEPLOYED
        - DEPLOYMENT_TARGET_STATUS_ARCHIVED
    BaseDeployment:
      title: Base Deployment
      type: object
      required:
        - object
        - id
        - description
        - status
        - activity_status
        - error_status
        - target_status
        - device_id
        - release_id
        - created_at
        - updated_at
      properties:
        object:
          type: string
          enum:
            - deployment
          example: deployment
          x-stainless-const: true
          description: The object type, which is always `deployment`.
        id:
          type: string
          example: dpl_123
          description: ID of the deployment.
        description:
          type: string
          example: Deployment for the motion control config instance
          description: The description of the deployment.
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        activity_status:
          $ref: '#/components/schemas/DeploymentActivityStatus'
        error_status:
          $ref: '#/components/schemas/DeploymentErrorStatus'
        target_status:
          $ref: '#/components/schemas/DeploymentTargetStatus'
        device_id:
          type: string
          example: dvc_123
          description: ID of the device.
        release_id:
          type: string
          example: rls_123
          description: ID of the release.
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: Timestamp of when the device release was created.
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: Timestamp of when the device release was last updated.
    BaseRelease:
      title: Base Release
      type: object
      required:
        - object
        - id
        - version
        - git_commit_id
        - created_at
        - updated_at
      properties:
        object:
          type: string
          enum:
            - release
          example: release
          x-stainless-const: true
          description: The object type, which is always `release`.
        id:
          type: string
          example: rls_123
          description: ID of the release.
        version:
          type: string
          example: v1.0.0
          description: The version of the release.
        git_commit_id:
          type: string
          nullable: true
          example: git_commit_123
          description: The ID of the git commit associated with this release.
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: Timestamp of when the release was created.
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: Timestamp of when the release was last updated.
    GitRepositoryType:
      type: string
      enum:
        - github
        - gitlab
        - bitbucket
      x-enum-varnames:
        - GIT_REPO_TYPE_GITHUB
        - GIT_REPO_TYPE_GITLAB
        - GIT_REPO_TYPE_BITBUCKET
    BaseGitCommit:
      title: Base Git Commit
      type: object
      required:
        - object
        - id
        - sha
        - message
        - repository_owner
        - repository_name
        - repository_type
        - repository_url
        - commit_url
        - created_at
      properties:
        object:
          type: string
          enum:
            - git_commit
          example: git_commit
          x-stainless-const: true
          description: The object type, which is always `git_commit`.
        id:
          type: string
          example: git_commit_123
          description: ID of the git commit.
        sha:
          type: string
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
          description: The SHA hash of the git commit.
        message:
          type: string
          example: Add basic motion configurations
          description: The commit message.
        repository_owner:
          type: string
          example: user
          description: The owner of the git repository.
        repository_name:
          type: string
          example: repo
          description: The name of the git repository.
        repository_type:
          $ref: '#/components/schemas/GitRepositoryType'
        repository_url:
          type: string
          example: https://github.com/user/repo
          description: The URL of the git repository.
        commit_url:
          type: string
          example: https://github.com/user/repo/commit/a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
          description: The URL of the git commit.
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the git commit was created.
    GitCommit:
      title: Git Commit
      allOf:
        - $ref: '#/components/schemas/BaseGitCommit'
      example:
        object: git_commit
        id: git_commit_123
        sha: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        message: Add basic motion configurations
        repository_owner: user
        repository_name: repo
        repository_type: github
        repository_url: https://github.com/user/repo
        commit_url: https://github.com/user/repo/commit/a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        created_at: '2021-01-01T00:00:00Z'
    Release:
      title: Release
      allOf:
        - $ref: '#/components/schemas/BaseRelease'
        - type: object
          properties:
            git_commit:
              description: The git commit associated with this release.
              nullable: true
              allOf:
                - $ref: '#/components/schemas/GitCommit'
      example:
        object: release
        id: rls_123
        version: v1.0.0
        git_commit_id: git_commit_123
        created_at: '2024-01-01T00:00:00Z'
        updated_at: '2024-01-01T00:00:00Z'
    BaseConfigInstance:
      title: Base Config Instance
      type: object
      required:
        - object
        - id
        - config_type_name
        - filepath
        - created_at
        - config_schema_id
        - config_type_id
      properties:
        object:
          type: string
          enum:
            - config_instance
          example: config_instance
          x-stainless-const: true
          description: The object type, which is always `config_instance`.
        id:
          type: string
          example: cfg_inst_123
          description: ID of the config instance.
        config_type_name:
          type: string
          example: Motion Control
          description: The name of the config type.
        filepath:
          type: string
          example: /srv/miru/configs/v1/motion-control.json
          description: The absolute file system path where this config instance is written.
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: The timestamp of when the config instance was created.
        config_schema_id:
          type: string
          example: cfg_sch_123
          description: ID of the config schema which the config instance must adhere to.
        config_type_id:
          type: string
          example: cfg_type_123
          description: ID of the config type which the config instance (and its schema) is a part of.
    InstanceFormat:
      title: Instance Format
      type: string
      description: |
        The on-disk format used when a config instance is written to the device filesystem.
        - `json`: standard JSON.
        - `yaml`: YAML 1.2.
        - `jsonc`: JSON with comments (JSON plus `//` and `/* */` comment syntax).
      enum:
        - json
        - yaml
        - jsonc
      x-enum-varnames:
        - INSTANCE_FORMAT_JSON
        - INSTANCE_FORMAT_YAML
        - INSTANCE_FORMAT_JSONC
    InstanceContent:
      title: Instance Content
      type: object
      required:
        - format
        - data
      properties:
        format:
          $ref: '#/components/schemas/InstanceFormat'
        data:
          type: string
          description: The configuration values associated with the config instance.
          example: |
            {
              "enable_autonomy": true,
              "enable_remote_control": true,
              "max_payload_kg": 10.0
            }
      example:
        format: json
        data: |
          {
            "enable_autonomy": true,
            "enable_remote_control": true,
            "max_payload_kg": 10.0
          }
    ConfigInstance:
      title: Config Instance
      allOf:
        - $ref: '#/components/schemas/BaseConfigInstance'
        - type: object
          properties:
            content:
              allOf:
                - $ref: '#/components/schemas/InstanceContent'
              description: The configuration values associated with the config instance. Expand the content using 'expand=content' in the query string.
      example:
        object: config_instance
        id: cfg_inst_123
        config_type_name: Motion Control
        filepath: /srv/miru/configs/v1/motion-control.json
        created_at: '2021-01-01T00:00:00Z'
        config_schema_id: cfg_sch_123
        config_type_id: cfg_typ_123
    Deployment:
      title: Deployment
      allOf:
        - $ref: '#/components/schemas/BaseDeployment'
        - type: object
          properties:
            release:
              allOf:
                - $ref: '#/components/schemas/Release'
              description: Expand the release using 'expand=release' in the query string.
            config_instances:
              type: array
              items:
                $ref: '#/components/schemas/ConfigInstance'
              description: Expand the config instances using 'expand=config_instances' in the query string.
              example:
                - object: config_instance
                  id: cfg_inst_123
                  config_type_name: Motion Control
                  filepath: /srv/miru/configs/v1/motion-control.json
                  created_at: '2021-01-01T00:00:00Z'
                  config_schema_id: cfg_sch_123
                  config_type_id: cfg_typ_123
                - object: config_instance
                  id: cfg_inst_456
                  config_type_name: Localization
                  filepath: /srv/miru/configs/v1/localization.json
                  created_at: '2021-01-02T00:00:00Z'
                  config_schema_id: cfg_sch_456
                  config_type_id: cfg_typ_456
      example:
        object: deployment
        id: dpl_123
        description: Deployment for the motion control config instance
        status: staged
        activity_status: staged
        error_status: none
        target_status: staged
        device_id: dvc_123
        release_id: rls_123
        created_at: '2024-01-01T00:00:00Z'
        updated_at: '2024-01-01T00:00:00Z'
    DeploymentList:
      title: Deployment List
      allOf:
        - $ref: '#/components/schemas/PaginatedList'
        - type: object
          required:
            - data
          properties:
            data:
              description: The list of deployments.
              type: array
              items:
                $ref: '#/components/schemas/Deployment'
    DeploymentExpansion:
      type: string
      enum:
        - release
        - config_instances
      x-enum-varnames:
        - DEPLOYMENT_EXPAND_RELEASE
        - DEPLOYMENT_EXPAND_CONFIG_INSTANCES
    UpdateDeploymentRequest:
      title: Update Deployment Request
      type: object
      properties:
        activity_status:
          allOf:
            - $ref: '#/components/schemas/DeploymentActivityStatus'
          description: The updated activity status of the deployment.
        error_status:
          allOf:
            - $ref: '#/components/schemas/DeploymentErrorStatus'
          description: The updated error status of the deployment.
        deployed_at:
          type: string
          format: date-time
          description: Independent historical watermark recording the last time the agent transitioned this deployment to Deployed. The current state is determined by activity_status, not by which timestamp is present. Set by the agent.
        archived_at:
          type: string
          format: date-time
          description: Independent historical watermark recording the last time the agent transitioned this deployment to Archived. The current state is determined by activity_status, not by which timestamp is present. Set by the agent.
    UploadRuleSource:
      title: Upload Rule Source
      type: object
      required:
        - glob
        - poll_interval
        - stability_window
      properties:
        glob:
          type: string
          pattern: ^/
          example: /var/log/robot/*.log
          description: An absolute glob pattern (must start with `/`) that selects the files to upload.
        poll_interval:
          type: string
          pattern: ^\d+(s|m|h)$
          example: 60s
          description: How often the agent checks matching files for upload eligibility, as a duration (e.g. `60s`).
        stability_window:
          type: string
          pattern: ^\d+(s|m|h)$
          example: 60s
          description: How long a matching file's size and modification time must stay unchanged (quiescent) before it is considered finished and eligible for upload, as a duration (e.g. `60s`). Files in a format with a finalization marker (e.g. MCAP, parquet) are detected directly; this window is the fallback for other files.
      example:
        glob: /var/log/robot/*.log
        poll_interval: 60s
        stability_window: 60s
    UploadDeletePolicy:
      title: Upload Delete Policy
      type: string
      description: |
        When the device deletes the local source file after collecting it for upload.
        - `never`: never delete the local file.
        - `after_upload`: delete the local file immediately once the upload is durably confirmed.
      enum:
        - never
        - after_upload
      x-enum-varnames:
        - UPLOAD_DELETE_POLICY_NEVER
        - UPLOAD_DELETE_POLICY_AFTER_UPLOAD
    UploadRuleDestination:
      title: Upload Rule Destination
      type: object
      required:
        - bucket_id
        - bucket_name
        - path
        - delete_policy
      properties:
        bucket_id:
          type: string
          example: bkt_123
          description: ID of the bucket this rule uploads to.
        bucket_name:
          type: string
          example: my-uploads-bucket
          description: Name of the bucket this rule uploads to.
        path:
          type: string
          pattern: .*\{device_id\}.*
          example: logs/{device_id}/{filename}
          description: The object-path template the collected file is written to. MUST contain `{device_id}` so each device's uploads are namespaced under its own verified ID.
        delete_policy:
          allOf:
            - $ref: '#/components/schemas/UploadDeletePolicy'
          description: When the device deletes the local source file after collecting it.
      example:
        bucket_id: bkt_123
        bucket_name: my-uploads-bucket
        path: logs/{device_id}/{filename}
        delete_policy: never
    BaseUploadRule:
      title: Base Upload Rule
      type: object
      required:
        - object
        - id
        - upload_collection_id
        - upload_collection_name
        - digest
        - source
        - destination
        - created_at
        - updated_at
      properties:
        object:
          type: string
          enum:
            - upload_rule
          example: upload_rule
          x-stainless-const: true
          description: The object type, which is always `upload_rule`.
        id:
          type: string
          example: upl_rule_123
          description: ID of the upload rule.
        upload_collection_id:
          type: string
          example: upl_col_123
          description: ID of the upload collection this rule belongs to.
        upload_collection_name:
          type: string
          example: Robot Logs
          description: The name of the upload collection this rule belongs to.
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the upload rule. Upload rules are immutable and deduplicated by digest within an upload collection.
        source:
          $ref: '#/components/schemas/UploadRuleSource'
        destination:
          $ref: '#/components/schemas/UploadRuleDestination'
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the upload rule was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the upload rule was last updated.
      example:
        object: upload_rule
        id: upl_rule_123
        upload_collection_id: upl_col_123
        upload_collection_name: Robot Logs
        digest: sha256:1234567890
        source:
          glob: /var/log/robot/*.log
          poll_interval: 60s
          stability_window: 60s
        destination:
          bucket_id: bkt_123
          bucket_name: my-uploads-bucket
          path: logs/{device_id}/{filename}
          delete_policy: never
        created_at: '2021-01-01T00:00:00Z'
        updated_at: '2021-01-01T00:00:00Z'
    UploadRuleList:
      title: Upload Rule List
      allOf:
        - $ref: '#/components/schemas/PaginatedList'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BaseUploadRule'
              description: The list of upload rules.
    UploadSource:
      title: Upload Source
      type: object
      description: Source-side details of the file on the device that produced an upload.
      required:
        - file_path
        - file_modified_at
      properties:
        file_path:
          type: string
          example: /var/log/robot/robot.log
          description: Absolute path of the file on the device. Its basename renders the `{filename}` token in the destination path template.
        file_modified_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: The file's last-modified time (mtime) on the device, i.e. roughly when writing finished.
      example:
        file_path: /var/log/robot/robot.log
        file_modified_at: '2021-01-01T00:00:00Z'
    CreateUploadRequest:
      title: Create Upload Request
      type: object
      required:
        - upload_rule_id
        - source
        - digest
        - size
        - release_id
        - deployment_id
      properties:
        upload_rule_id:
          type: string
          example: upl_rule_123
          description: ID of the upload rule that selected this file.
        source:
          allOf:
            - $ref: '#/components/schemas/UploadSource'
          description: Source-side details of the file on the device.
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the file being uploaded.
        size:
          type: integer
          format: int64
          example: 1048576
          description: The size of the file in bytes.
        incomplete:
          type: boolean
          default: false
          example: false
          description: Whether the file was incomplete when collected (e.g. it was never closed cleanly / has no finalization marker). Sets the upload's `incomplete` flag. Defaults to false.
        release_id:
          type: string
          example: rls_123
          description: ID of the release the device is currently on.
        deployment_id:
          type: string
          example: dpl_123
          description: ID of the deployment the device is currently on.
    UploadRequiredHeaders:
      title: Upload Required Headers
      type: object
      description: |
        Provenance metadata the device MUST send as headers on the presigned PUT.
        These values are echoed into the bucket object's metadata and are populated
        server-side from the authenticated device's identity; the device never
        supplies them as request input.
      required:
        - device_id
        - release_id
        - deployment_id
        - config_version
        - digest
        - file_modified_at
      properties:
        device_id:
          type: string
          example: dvc_123
          description: The verified ID of the device that produced the upload.
        release_id:
          type: string
          example: rls_123
          description: The ID of the release the device was on when the file was captured.
        deployment_id:
          type: string
          example: dpl_123
          description: The ID of the deployment the device was on when the file was captured.
        config_version:
          type: string
          example: v1.0.0
          description: The config version active on the device when the file was captured.
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the file being uploaded.
        file_modified_at:
          type: string
          example: '2021-01-01T00:00:00Z'
          description: The file's last-modified time (mtime) on the device, i.e. roughly when writing finished.
      example:
        device_id: dvc_123
        release_id: rls_123
        deployment_id: dpl_123
        config_version: v1.0.0
        digest: sha256:1234567890
        file_modified_at: '2021-01-01T00:00:00Z'
    PresignedUpload:
      title: Presigned Upload
      type: object
      required:
        - upload_id
        - upload_url
        - object_key
        - expires_at
        - required_headers
        - already_uploaded
      properties:
        upload_id:
          type: string
          example: upl_123
          description: ID of the upload ledger entry created for this request.
        upload_url:
          type: string
          example: https://storage.googleapis.com/my-uploads-bucket/logs/dvc_123/robot.log?X-Goog-Signature=...
          description: The short-lived V4-presigned PUT URL the device uploads the file to.
        object_key:
          type: string
          example: logs/dvc_123/robot.log
          description: The object path in the destination bucket. Carries the device's verified ID.
        expires_at:
          type: string
          format: date-time
          example: '2021-01-01T00:15:00Z'
          description: Timestamp after which the presigned URL is no longer valid.
        required_headers:
          $ref: '#/components/schemas/UploadRequiredHeaders'
        already_uploaded:
          type: boolean
          example: false
          description: True if a durable upload with the same digest already exists, in which case the device may skip the PUT.
      example:
        upload_id: upl_123
        upload_url: https://storage.googleapis.com/my-uploads-bucket/logs/dvc_123/robot.log?X-Goog-Signature=...
        object_key: logs/dvc_123/robot.log
        expires_at: '2021-01-01T00:15:00Z'
        required_headers:
          device_id: dvc_123
          release_id: rls_123
          deployment_id: dpl_123
          config_version: v1.0.0
          digest: sha256:1234567890
          file_modified_at: '2021-01-01T00:00:00Z'
        already_uploaded: false
    UploadDestination:
      title: Upload Destination
      type: object
      description: Destination-side details of where an upload was written.
      required:
        - bucket_id
        - object_key
      properties:
        bucket_id:
          type: string
          example: bkt_123
          description: ID of the registered bucket the file was uploaded to.
        object_key:
          type: string
          example: logs/dvc_123/robot.log
          description: The object path the file was written to in the destination bucket. Carries the device's verified ID.
      example:
        bucket_id: bkt_123
        object_key: logs/dvc_123/robot.log
    UploadStatus:
      title: Upload Status
      type: string
      description: |
        The lifecycle status of an upload in the ledger.
        - `pending`: a presigned URL has been minted but the device has not yet confirmed a durable write.
        - `uploaded`: the device confirmed a durable write to the bucket.
      enum:
        - pending
        - uploaded
      x-enum-varnames:
        - UPLOAD_STATUS_PENDING
        - UPLOAD_STATUS_UPLOADED
    BaseUpload:
      title: Base Upload
      type: object
      required:
        - object
        - id
        - device_id
        - upload_rule_id
        - upload_rule_name
        - source
        - destination
        - digest
        - size
        - status
        - incomplete
        - release_id
        - deployment_id
        - uploaded_at
        - created_at
        - updated_at
        - workspace_id
      properties:
        object:
          type: string
          enum:
            - upload
          example: upload
          x-stainless-const: true
          description: The object type, which is always `upload`.
        id:
          type: string
          example: upl_123
          description: ID of the upload.
        device_id:
          type: string
          example: dvc_123
          description: ID of the device that produced the upload.
        upload_rule_id:
          type: string
          example: upl_rule_123
          description: ID of the upload rule that produced the upload.
        upload_rule_name:
          type: string
          example: Robot Logs
          description: Human-readable name of the upload rule that produced the upload.
        source:
          allOf:
            - $ref: '#/components/schemas/UploadSource'
          description: Source-side details of the file on the device that produced this upload.
        destination:
          allOf:
            - $ref: '#/components/schemas/UploadDestination'
          description: Destination-side details of where the file was uploaded.
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the uploaded file.
        size:
          type: integer
          format: int64
          example: 1048576
          description: The size of the uploaded file in bytes.
        status:
          $ref: '#/components/schemas/UploadStatus'
        incomplete:
          type: boolean
          example: false
          description: 'Whether the file was incomplete when collected (the mint request carried `incomplete: true`). Independent of `status`.'
        release_id:
          type: string
          example: rls_123
          description: ID of the release the device was on when the upload was produced.
        deployment_id:
          type: string
          example: dpl_123
          description: ID of the deployment that was active on the device when the upload was produced.
        uploaded_at:
          type: string
          format: date-time
          nullable: true
          example: '2021-01-01T00:00:10Z'
          description: Timestamp of when the upload was durably confirmed. Null until the upload completes.
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the upload was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the upload was last updated.
        workspace_id:
          type: string
          example: wksp_123
          description: ID of the workspace that owns the upload.
    Upload:
      title: Upload
      allOf:
        - $ref: '#/components/schemas/BaseUpload'
      example:
        object: upload
        id: upl_123
        device_id: dvc_123
        upload_rule_id: upl_rule_123
        upload_rule_name: Robot Logs
        source:
          file_path: /var/log/robot/robot.log
          file_modified_at: '2021-01-01T00:00:00Z'
        destination:
          bucket_id: bkt_123
          object_key: logs/dvc_123/robot.log
        digest: sha256:1234567890
        size: 1048576
        status: uploaded
        incomplete: false
        release_id: rls_123
        deployment_id: dpl_123
        uploaded_at: '2021-01-01T00:00:10Z'
        created_at: '2021-01-01T00:00:00Z'
        updated_at: '2021-01-01T00:00:00Z'
        workspace_id: wksp_123
    DeviceStatus:
      type: string
      description: |
        The status of the device.
        - Inactive: The miru agent has not yet been installed / authenticated
        - Activating: The miru agent is currently being installed / authenticated (should only last for a few seconds)
        - Online: The miru agent has successfully pinged the server within the last 60 seconds.
        - Offline: The miru agent has not successfully pinged the server within the last 60 seconds (e.g. network issues, device is powered off, etc.)
        - Archived: The device has been archived. The agent's session has been revoked and the device no longer participates in workspace operations. See `archived_at` for when this occurred.
      enum:
        - inactive
        - activating
        - online
        - offline
        - archived
      x-enum-varnames:
        - DEVICE_STATUS_INACTIVE
        - DEVICE_STATUS_ACTIVATING
        - DEVICE_STATUS_ONLINE
        - DEVICE_STATUS_OFFLINE
        - DEVICE_STATUS_ARCHIVED
    BaseDevice:
      title: Base Device
      type: object
      required:
        - object
        - id
        - name
        - description
        - status
        - agent_version
        - last_connected_at
        - last_disconnected_at
        - created_at
        - updated_at
      properties:
        object:
          type: string
          enum:
            - device
          example: device
          x-stainless-const: true
          description: The object type, which is always `device`.
        id:
          type: string
          example: dvc_123
          description: ID of the device.
        name:
          type: string
          example: My Device
          description: Name of the device.
        description:
          type: string
          nullable: true
          example: Welder on line 3
          description: A free-form description of the device.
        status:
          $ref: '#/components/schemas/DeviceStatus'
        agent_version:
          type: string
          example: v1.0.0
          description: The version of the agent the device is running.
          nullable: true
        last_connected_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          nullable: true
          description: Timestamp of when the device was last made an initial connection (this is not the same as the last time the device was seen).
        last_disconnected_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          nullable: true
          description: Timestamp of when the device was last disconnected (this is not the same as the last time the device was seen).
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device was last updated.
    Device:
      title: Device
      allOf:
        - $ref: '#/components/schemas/BaseDevice'
        - type: object
          required:
            - session_id
          properties:
            session_id:
              type: string
              example: dvc_sess_123
              description: Session ID of the device.
      example:
        object: device
        id: dvc_123
        name: My Device
        description: Welder on line 3
        status: online
        agent_version: v1.0.0
        last_connected_at: '2021-01-01T00:00:00Z'
