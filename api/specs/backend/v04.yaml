    ReleaseExpansion:
      type: string
      enum:
      - upload_rules
      x-enum-varnames:
      - RELEASE_EXPAND_UPLOAD_RULES
    UploadSource:
      title: Upload Source
      type: object
      description: Source-side details of the file on the device that produced an
        upload.
      required:
      - file_path
      - mtime
      - first_observed_at
      - last_observed_at
      properties:
        file_path:
          type: string
          example: /var/log/robot/robot.log
          description: Absolute path of the file on the device. Its basename renders
            the `{filename}` token in the destination path template.
        mtime:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: The file's last-modified time (mtime) on the device, i.e. roughly
            when writing finished.
        first_observed_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device agent first observed the file
            on the device.
        last_observed_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:05Z'
          description: Timestamp of when the device agent most recently observed the
            file before the upload was minted.
      example:
        file_path: /var/log/robot/robot.log
        mtime: '2021-01-01T00:00:00Z'
        first_observed_at: '2021-01-01T00:00:00Z'
        last_observed_at: '2021-01-01T00:00:05Z'
    CreateUploadRequest:
      title: Create Upload Request
      type: object
      required:
      - upload_rule_id
      - source
      - digest
      - size
      - deployment_id
      properties:
        upload_rule_id:
          type: string
          example: upl_rule_123
          description: ID of the upload rule that selected this file.
        source:
          allOf:
          - $ref: '#/components/schemas/UploadSource'
          description: Source-side details of the file on the device.
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the file being uploaded.
        size:
          type: integer
          format: int64
          example: 1048576
          description: The size of the file in bytes.
        incomplete:
          type: boolean
          default: false
          example: false
          description: Whether the file was incomplete when collected (e.g. it was
            never closed cleanly / has no finalization marker). Sets the upload's
            `incomplete` flag. Defaults to false.
        deployment_id:
          type: string
          example: dpl_123
          description: ID of the deployment the device is currently on.
    UploadDestination:
      title: Upload Destination
      type: object
      description: Destination-side details of where an upload was written.
      required:
      - bucket_id
      - bucket_name
      - object_key
      properties:
        bucket_id:
          type: string
          example: bkt_123
          description: ID of the registered bucket the file was uploaded to.
        bucket_name:
          type: string
          example: my-uploads-bucket
          description: Physical name of the bucket in the object store. This is the
