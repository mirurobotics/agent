        object_key:
          type: string
          example: logs/dvc_123/robot.log
          description: The object path the file was written to in the destination
            bucket. Carries the device's verified ID.
      example:
        bucket_id: bkt_123
        bucket_name: my-uploads-bucket
        object_key: logs/dvc_123/robot.log
    UploadStatus:
