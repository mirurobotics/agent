openapi: 3.0.3
info:
  title: Miru Agent API
  description: The API between the Miru Backend and the Agent; for internal use only
  version: v0.4
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-release-version: v0.4.1-alpha.1
  x-git-commit:
    sha: 23848f9a79a880b989d7d7949b83329b0e44d85e
    url: https://github.com/mirurobotics/openapi/commit/23848f9a79a880b989d7d7949b83329b0e44d85e
    message: "fix(stlc): re-anchor platform seal onto the real SDK on staging main\
      \ (#203)\n\n## Problem\n\nThe `stlc-generate` push build fails on the **platform**\
      \ target with:\n\n```\n✗ python: origin/main has diverged from the last sealed\
      \ integrated commit on this branch.\n  origin/main: c416f66d97fc\n  integrated:\
      \  b77b8473e502\n```\n\n(run:\nhttps://github.com/mirurobotics/openapi/actions/runs/29300994249/job/86984614129\n\
      — `platform` fails; `cli` and `device` pass.)\n\n## Root cause\n\nThe platform\
      \ milestone-A seal (added in #140) pinned `integrated` to\n`b77b8473` *\"initial\
      \ stlc build\"* — a **broken, near-empty build** whose\nonly diff vs the pre-stlc\
      \ base was `.stats.yml` +\n`src/miru_platform/lib/.keep` (no actual SDK). The\
      \ real, full platform\nSDK was later pushed to `python-platform-sdk-staging`\
      \ `main` as\n`c416f66d` (#147), but the tracking seal was never updated.\n\n\
      The two are **siblings** (same parent `c38cf33`, neither descends from\nthe\
      \ other) with **different trees**, so stlc's sibling-divergence guard\nthrows\
      \ on every push build. The `device` target has the same commit\ntopology but\
      \ passes, because its sealed `integrated` tree is *identical*\nto its `main`\
      \ tree, so stlc's reconcile check treats the remote as\ncontributing nothing.\n\
      \n## Fix\n\nThere is **no custom code** for this target (no `*-custom-code`\
      \ patch\nfiles, only the tracking JSON). So re-anchor `base` == `integrated`\
      \ ==\nthe current staging `main` tip `c416f66d`. This matches the healthy\n\
      device shape (integrated tree == main tree), the guard passes, and the\nnext\
      \ push build regenerates from the current spec and pushes cleanly.\nNothing\
      \ on `main` is discarded.\n\n## After merge\n\nThe change is under `sdkgen/*/stainless/custom-code/`,\
      \ so the push\nloop-breaker `guard` treats it as a seal-only change and runs\
      \ **no**\nrebuild. To actually rebuild + push the up-to-date platform SDK, run\
      \ the\n**Generate SDKs with stlc** workflow via `workflow_dispatch` (project:\n\
      `platform`).\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\
      \n<!-- codesmith:footer -->\n---\n<a\nhref=\"https://app.blacksmith.sh/mirurobotics/codesmith/openapi/pr/203\"\
      ><picture><source\nmedia=\"(prefers-color-scheme: dark)\"\nsrcset=\"https://pr-comments-assets.blacksmith.sh/codesmith/view-with-codesmith-dark-v2.svg\"\
      ><source\nmedia=\"(prefers-color-scheme: light)\"\nsrcset=\"https://pr-comments-assets.blacksmith.sh/codesmith/view-with-codesmith-light-v2.svg\"\
      ><img\nalt=\"View with Codesmith\"\nsrc=\"https://pr-comments-assets.blacksmith.sh/codesmith/view-with-codesmith-dark-v2.svg\"\
      ></picture></a>\n<a\nhref=\"https://backend.blacksmith.sh/track/enable-autofix?expires=1786757258&installation_id=142588636&pr_number=203&repository=mirurobotics%2Fopenapi&return_to=https%3A%2F%2Fgithub.com%2Fmirurobotics%2Fopenapi%2Fpull%2F203&signature=d0e6c26c6871340b8b8ad24dfed56c8443e990bea1bed7bbd3a9471637100e8a\"\
      ><picture><source\nmedia=\"(prefers-color-scheme: dark)\"\nsrcset=\"https://pr-comments-assets.blacksmith.sh/codesmith/autofix-with-codesmith-dark.svg\"\
      ><source\nmedia=\"(prefers-color-scheme: light)\"\nsrcset=\"https://pr-comments-assets.blacksmith.sh/codesmith/autofix-with-codesmith-light.svg\"\
      ><img\nalt=\"Autofix with Codesmith\"\nsrc=\"https://pr-comments-assets.blacksmith.sh/codesmith/autofix-with-codesmith-dark.svg\"\
      ></picture></a>\n<sup>Need help on this PR? Tag <code>@codesmith</code> with\
      \ what you\nneed. Autofix is disabled.</sup>\n\n<!-- codesmith:autofix:disabled\
      \ -->\n<!-- /codesmith:footer -->\n\nCo-authored-by: Claude Opus 4.8 <noreply@anthropic.com>"
    author: ben-miru
    branch: HEAD
    dirty: false
  x-build:
    built_at: '2026-07-16T02:43:53.052099+00:00'
servers:
- url: https://staging.api.mirurobotics.com/agent/v1
  description: Staging
- url: https://uat.api.mirurobotics.com/agent/v1
  description: UAT
- url: https://api.mirurobotics.com/agent/v1
  description: Production
security:
- DeviceSessionToken: []
paths:
  /version:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Version
      summary: Get
      description: Retrieve the version information of the application.
      operationId: getVersion
      responses:
        '200':
          description: Successfully retrieved the release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /config_instances/{config_instance_id}/content:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Config Instances
      summary: Download Content
      description: Download the content of a config instance.
      operationId: getConfigInstanceContent
      parameters:
      - $ref: '#/components/parameters/config_instance_id'
      - $ref: '#/components/parameters/disposition'
      responses:
        '200':
          description: Successfully retrieved the config instance content. The Content-Type
            header is set according to the instance format.
          headers:
            Content-Disposition:
              description: Header indicating whether the file is returned inline or
                as an attachment.
              schema:
                type: string
                example: inline
            Content-Type:
              description: The MIME type of the instance content.
              schema:
                type: string
                example: application/json
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: The raw config instance content.
  /deployments:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Deployments
      summary: List
      operationId: listDeployments
      description: List all deployments.
      parameters:
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/deployment_list_expansions'
      - $ref: '#/components/parameters/deployment_search_activity_status'
      responses:
        '200':
          description: Successfully listed the deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentList'
  /deployments/{deployment_id}:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Deployments
      summary: Get
      operationId: getDeployment
      description: Retrieve a deployment by its ID.
      parameters:
      - $ref: '#/components/parameters/deployment_id'
      responses:
        '200':
          description: Successfully retrieved the deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
    patch:
      tags:
      - Deployments
      summary: Update
      operationId: updateDeployment
      description: Update a deployment.
      parameters:
      - $ref: '#/components/parameters/deployment_id'
      - $ref: '#/components/parameters/deployment_expansions'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentRequest'
      responses:
        '200':
          description: Successfully updated the deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
  /releases/{release_id}:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Releases
      summary: Get
      operationId: getRelease
      description: Retrieve a release by its ID.
      parameters:
      - $ref: '#/components/parameters/release_id'
      - $ref: '#/components/parameters/release_expansions'
      responses:
        '200':
          description: Successfully retrieved the release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /uploads:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
      - Uploads
      summary: Create
      operationId: createUpload
      description: 'Request an upload for a captured file. The backend verifies the
        calling

        device from its session token, creates a ledger entry, authorizes the exact

        `object_key` and provenance, performs digest dedup, and vends short-lived

        downscoped cloud credentials scoped to that one object key. The device

        uploads the file directly via the native cloud SDK (S3 multipart / GCS

        resumable), then calls `POST /uploads/{upload_id}/confirm`. The device''s

        identity is derived from the token and is never read from the request body.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '200':
          description: Successfully created the upload ledger entry and vended downscoped
            credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadWithCredentials'
  /uploads/{upload_id}/credentials:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
      - Uploads
      summary: Vend Credentials
      operationId: vendUploadCredentials
      description: Vend the downscoped credentials for the upload.
      parameters:
      - $ref: '#/components/parameters/upload_id'
      responses:
        '200':
          description: Successfully vended downscoped credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCredentials'
  /uploads/{upload_id}/confirm:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
      - Uploads
      summary: Confirm
      operationId: confirmUpload
      description: Confirm that the device durably wrote the upload to the destination
        bucket.
      parameters:
      - $ref: '#/components/parameters/upload_id'
      responses:
        '200':
          description: Successfully confirmed the upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
  /git_commits/{git_commit_id}:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Git Commits
      summary: Get
      operationId: getGitCommit
      description: Retrieve a git commit by its ID.
      parameters:
      - $ref: '#/components/parameters/git_commit_id'
      responses:
        '200':
          description: Successfully retrieved the git commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommit'
  /device:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - Devices
      summary: Get Self
      operationId: getDeviceSelf
      description: 'Retrieve the calling device''s own record. The device is identified
        by the bearer session token from the `DeviceSessionToken` security scheme.

        '
      responses:
        '200':
          description: Successfully retrieved the calling device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/{device_id}:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    patch:
      tags:
      - Devices
      summary: Update
      operationId: updateDeviceByAgent
      description: Update a device from the agent.
      parameters:
      - $ref: '#/components/parameters/device_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceFromAgentRequest'
      responses:
        '200':
          description: Successfully updated the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/provision:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
      - Devices
      summary: Provision
      operationId: provisionDevice
      security:
      - ProvisioningToken: []
      description: Provision a device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionDeviceRequest'
      responses:
        '200':
          description: Successfully provisioned the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/reprovision:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
      - Devices
      summary: Reprovision
      operationId: reprovisionDevice
      security:
      - ProvisioningToken: []
      description: 'Reprovision an existing device — rebind the device record to the
        calling physical machine. Invalidates any prior session, registers the new
        public key from the request body, and triggers a redeploy of the device''s
        current deployment. Deployment history is preserved across the swap. The target
        device is identified by the provisioning token, not by name.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprovisionDeviceRequest'
      responses:
        '200':
          description: Successfully reprovisioned the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/token:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    post:
      tags:
      - Devices
      summary: Issue Token
      operationId: issueDeviceToken
      security:
      - DeviceKeyJWT: []
      description: 'Issue a device session token. The device authenticates by sending
        an `Authorization: Bearer <jwt>` header carrying a JWT it has self-signed
        with its own RSA private key (already enrolled at provisioning time via `public_key_pem`).
        The server reads the JWT header''s `kid` parameter, looks up the device whose
        registered public-key fingerprint equals `kid`, and verifies the JWT signature
        against that stored public key. `kid` is a lookup hint only — the security
        boundary is "the signature verifies against the stored public key for the
        device with this fingerprint".


        Public-key fingerprint: the input is the device''s registered RSA public key.
        Serialize it as DER-encoded `SubjectPublicKeyInfo` (PKIX SPKI, RFC 5280 §4.1
        — the same byte sequence that `-----BEGIN PUBLIC KEY-----` PEM decodes to),
        SHA-256 the bytes, and lowercase-hex encode the digest. The result is exactly
        64 hex characters.


        JWT contract:

        - Header MUST contain `alg: RS512` (RSA-PKCS1-v1_5 with SHA-512).

        - Header MUST contain `kid` (the 64-character lowercase hex public-key fingerprint).

        - Header MUST NOT embed the public key as a JWT header parameter. Servers
        MAY reject the request if such an embedded-key header parameter is present.

        - Payload MUST contain `jti` (unique per request, used for replay protection),
        `iat` (issued-at, RFC 7519 numeric date), and `exp` (expiration, RFC 7519
        numeric date). Lifetime is 2 minutes (`exp = iat + 120`).

        - Signing input is `base64url(header) . base64url(payload)` per RFC 7515 §5.1.

        '
      responses:
        '200':
          description: Successfully issued the device token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
  /cmd/devices/{device_id}/sync:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - MQTT
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          example: dvc_123
      summary: Sync
      operationId: syncDevice
      description: Send a sync command to a device.
      responses:
        '200':
          description: Triggered a device sync.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDevice'
  /cmd/devices/{device_id}/ping:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - MQTT
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          example: dvc_123
      summary: Ping
      operationId: pingDevice
      description: Send a ping command to a device.
      responses:
        '200':
          description: Ping a device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ping'
  /resp/devices/{device_id}/pong:
    parameters:
    - $ref: '#/components/parameters/MiruVersion'
    get:
      tags:
      - MQTT
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          example: dvc_123
      summary: Pong
      operationId: devicePong
      description: Receive a pong response from a device.
      responses:
        '200':
          description: Ping response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'
components:
  securitySchemes:
    DeviceSessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Server-issued device session token. Obtained by the device from
        `POST /devices/token` (defined in this spec) using its `DeviceKeyJWT` bootstrap
        credential, then sent as `Authorization: Bearer <token>` on every other agent
        endpoint. The token identifies the calling device to the backend.

        '
    DeviceKeyJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Device-self-signed JWT used to bootstrap a session token. The
        device signs a JWT with its own RSA private key; the server identifies the
        device by reading the `kid` header (the SHA-256 fingerprint of the device''s
        registered public key, as DER-encoded SubjectPublicKeyInfo, lowercase hex)
        and verifies the JWT signature against the stored public key for that device.
        See `POST /devices/token` for the full JWT contract.

        '
    ProvisioningToken:
      type: http
      scheme: bearer
      description: 'Short-lived (5-minute) provisioning token used to bootstrap a
        device''s identity on `POST /devices/provision` and `POST /devices/reprovision`.
        Minted from the Miru dashboard (programmatic minting via the Platform API
        is forthcoming) and sent as `Authorization: Bearer <token>`. A provisioning
        token may be either device-bound (issued for a specific pre-created device
        record, used by the dashboard activate/reprovision flow) or workspace-bound
        (used for bulk provisioning, where the target device is selected or created
        by `name` in the request body).

        '
  schemas:
    APIVersion:
      type: string
      enum:
      - v0.4
      x-enum-varnames:
      - API_VERSION
      x-stainless-const: true
    ReleaseVersion:
      type: string
      enum:
      - v0.4.1-alpha.1
      x-enum-varnames:
      - RELEASE_VERSION
      x-stainless-const: true
    APIGitCommit:
      type: string
      enum:
      - 23848f9a79a880b989d7d7949b83329b0e44d85e
      x-enum-varnames:
      - API_GIT_COMMIT
      x-stainless-const: true
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    DplSearch:
      type: string
      description: '**Internal server use only**: an enum of possible search fields.

        '
      enum:
      - activity_status
      x-enum-varnames:
      - DPL_SEARCH_ACTIVITY_STATUS
    Version:
      title: Version
      type: object
      required:
      - version
      - git_commit
      - api_version
      - api_git_commit
      - api_release_version
      - go_version
      - build_date
      - os
      - arch
      properties:
        version:
          type: string
          description: The version of the application.
          example: v1.0.0
        git_commit:
          type: string
          description: The git commit of the application.
          example: a1b2c3d4
        api_version:
          type: string
          description: The API version of the application.
          example: 2026-02-24.zion
        api_git_commit:
          type: string
          description: The git commit of the API.
          example: a1b2c3d4
        api_release_version:
          type: string
          description: The API release version of the application.
          example: 2026-02-24.yukon-beta.1
        go_version:
          type: string
          description: The version of Go.
          example: go1.20.0
        build_date:
          type: string
          format: date-time
          description: The build date of the application.
          example: '2025-01-01T00:00:00Z'
        os:
          type: string
          description: The operating system of the application.
          example: linux
        arch:
          type: string
          description: The architecture of the application.
          example: aarch64
      example:
        version: v1.0.0
        git_commit: a1b2c3d4
        api_version: 2026-02-24.zion
        api_git_commit: a1b2c3d4
        api_release_version: 2026-02-24.yukon-beta.1
        go_version: go1.20.0
        build_date: '2025-01-01T00:00:00Z'
        os: linux
        arch: aarch64
    DeploymentListExpansion:
      type: string
      enum:
      - total_count
      - release
      - config_instances
      x-enum-varnames:
      - DEPLOYMENT_LIST_EXPAND_TOTAL_COUNT
      - DEPLOYMENT_LIST_EXPAND_RELEASE
      - DEPLOYMENT_LIST_EXPAND_CONFIG_INSTANCES
    DeploymentActivityStatus:
      type: string
      description: 'Last known activity state of the deployment.


        `drifted` means the device''s configurations have drifted since this deployment
        was staged, and the deployment needs to be reviewed before it can be deployed.


        `staged` means the deployment is ready to be deployed.


        `queued` means the deployment''s config instances are waiting to be received
        by the device and will be deployed as soon as the device is online.


        `deployed` means the deployment''s config instances are currently available
        for consumption on the device.


        `removing` means the deployment''s config instances are being removed from
        the device.


        `archived` means the deployment is available for historical reference but
        cannot be deployed and is not active on the device.

        '
      enum:
      - drifted
      - staged
      - queued
      - deployed
      - removing
      - archived
      x-enum-varnames:
      - DEPLOYMENT_ACTIVITY_STATUS_DRIFTED
      - DEPLOYMENT_ACTIVITY_STATUS_STAGED
      - DEPLOYMENT_ACTIVITY_STATUS_QUEUED
      - DEPLOYMENT_ACTIVITY_STATUS_DEPLOYED
      - DEPLOYMENT_ACTIVITY_STATUS_REMOVING
      - DEPLOYMENT_ACTIVITY_STATUS_ARCHIVED
    PaginatedList:
      title: Paginated List
      type: object
      required:
      - object
      - limit
      - offset
      - has_more
      properties:
        object:
          type: string
          enum:
          - list
          example: list
          x-stainless-const: true
          description: The object type, which is always `list`.
        total_count:
          type: integer
          format: int64
          description: The total number of items in the list. By default the total
            count is not returned. The total count must be expanded (using expand=total_count)
            to get the total number of items in the list.
        limit:
          type: integer
          description: The maximum number of items to return. A limit of 15 with an
            offset of 0 returns items 1-15.
          default: 10
          minimum: 1
          maximum: 100
        offset:
          type: integer
          description: The offset of the items to return. An offset of 10 with a limit
            of 10 returns items 11-20.
          default: 0
          minimum: 0
        has_more:
          type: boolean
          description: True if there are more items in the list to return. False if
            there are no more items to return.
          example: false
    DeploymentStatus:
      type: string
      description: 'This status merges the ''activity_status'' and ''error_status''
        fields, with error states taking precedence over activity states when errors
        are present. For example, if the activity status is ''deployed'' but the error
        status is ''failed'', the status is ''failed''. However, if the error status
        is ''none'' and the activity status is ''deployed'', the status is ''deployed''.

        '
      enum:
      - drifted
      - staged
      - queued
      - deployed
      - removing
      - archived
      - failed
      - retrying
      x-enum-varnames:
      - DEPLOYMENT_STATUS_DRIFTED
      - DEPLOYMENT_STATUS_STAGED
      - DEPLOYMENT_STATUS_QUEUED
      - DEPLOYMENT_STATUS_DEPLOYED
      - DEPLOYMENT_STATUS_REMOVING
      - DEPLOYMENT_STATUS_ARCHIVED
      - DEPLOYMENT_STATUS_FAILED
      - DEPLOYMENT_STATUS_RETRYING
    DeploymentErrorStatus:
      type: string
      description: 'Last known error state of the deployment.


        `none` means there are no errors.


        `retrying` means an error has been encountered and the agent is retrying to
        reach the target status.


        `failed` means a fatal error has been encountered; the deployment is archived
        and, if deployed, removed from the device.

        '
      enum:
      - none
      - failed
      - retrying
      x-enum-varnames:
      - DEPLOYMENT_ERROR_STATUS_NONE
      - DEPLOYMENT_ERROR_STATUS_FAILED
      - DEPLOYMENT_ERROR_STATUS_RETRYING
    DeploymentTargetStatus:
      type: string
      description: 'Desired state of the deployment.


        `staged` means the deployment is ready to be deployed.


        `deployed` means all config instances in the deployment are available for
        consumption on the device.


        `archived` means the deployment is available for historical reference but
        cannot be deployed and is not active on the device.

        '
      enum:
      - staged
      - deployed
      - archived
      x-enum-varnames:
      - DEPLOYMENT_TARGET_STATUS_STAGED
      - DEPLOYMENT_TARGET_STATUS_DEPLOYED
      - DEPLOYMENT_TARGET_STATUS_ARCHIVED
    BaseDeployment:
      title: Base Deployment
      type: object
      required:
      - object
