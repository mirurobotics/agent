        workspace_id:
          type: string
          example: wksp_123
          description: ID of the workspace that owns the upload.
    Upload:
      title: Upload
      allOf:
      - $ref: '#/components/schemas/BaseUpload'
      example:
        object: upload
        id: upl_123
        device_id: dvc_123
        file_rule_id: file_rule_123
        upload_collection_name: Robot Logs
        source:
          file_path: /var/log/robot/robot.log
          mtime: '2021-01-01T00:00:00Z'
          first_observed_at: '2021-01-01T00:00:00Z'
          last_observed_at: '2021-01-01T00:00:05Z'
        destination:
          bucket_id: bkt_123
          bucket_name: my-uploads-bucket
          object_key: logs/dvc_123/robot.log
        digest: sha256:1234567890
        size: 1048576
        status: uploaded
        incomplete: false
        release_id: rls_123
        deployment_id: dpl_123
        uploaded_at: '2021-01-01T00:00:10Z'
        created_at: '2021-01-01T00:00:00Z'
        updated_at: '2021-01-01T00:00:00Z'
        workspace_id: wksp_123
    S3UploadCredentials:
      title: S3 Upload Credentials
      type: object
      description: 'Short-lived AWS S3 session credentials for the broker upload flow.
        The

        backend vends session credentials scoped to `s3:PutObject` (plus the

        multipart actions) on the exact object key. The device drives a native

        S3 multipart upload with the standard AWS S3 SDK, configured from

        `region` plus the access key / secret / session token; the SDK derives

        the endpoint from the region.

        '
      required:
      - scheme
      - access_key_id
      - secret_access_key
      - session_token
      - region
      - expires_at
      properties:
        scheme:
          type: string
          enum:
          - s3
          example: s3
          x-stainless-const: true
          description: The storage access scheme, which is always `s3` for these credentials.
        access_key_id:
          type: string
          example: ASIAIOSFODNN7EXAMPLE
          description: The STS session access key ID.
        secret_access_key:
          type: string
          example: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          description: The STS session secret access key.
        session_token:
          type: string
          example: FwoGZXIvYXdzEBaDOEXAMPLE...redacted...opaque-session-token
          description: The STS session token that must accompany the access key pair.
        region:
          type: string
          example: us-east-1
          description: The AWS region of the bucket, used for the S3 endpoint and
            SigV4 signing.
        expires_at:
          type: string
          format: date-time
          example: '2021-01-01T01:00:00Z'
          description: Timestamp after which the session credentials are no longer
            valid.
      example:
        scheme: s3
        access_key_id: ASIAIOSFODNN7EXAMPLE
        secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        session_token: FwoGZXIvYXdzEBaDOEXAMPLE...redacted...opaque-session-token
        region: us-east-1
        expires_at: '2021-01-01T01:00:00Z'
    GcsUploadCredentials:
      title: GCS Upload Credentials
      type: object
      description: 'Short-lived Google Cloud Storage credentials for the broker upload
        flow. The

        backend impersonates the bucket''s service account and downscopes the token

        with a Credential Access Boundary (CAB) to `storage.objects.create` on the

        exact object name, so the device can drive a native resumable upload directly.

        '
      required:
      - scheme
      - access_token
      - expires_at
      properties:
        scheme:
          type: string
          enum:
          - gcs
          example: gcs
          x-stainless-const: true
          description: The storage access scheme, which is always `gcs` for these
            credentials.
        access_token:
          type: string
          example: ya29.c.b0Aaekm1J...redacted...opaque-oauth2-token
          description: 'A downscoped GCS OAuth2 bearer token the device sends as `Authorization:
            Bearer <token>` on the resumable upload.'
        expires_at:
          type: string
          format: date-time
          example: '2021-01-01T01:00:00Z'
          description: Timestamp after which the access token is no longer valid.
      example:
        scheme: gcs
        access_token: ya29.c.b0Aaekm1J...redacted...opaque-oauth2-token
        expires_at: '2021-01-01T01:00:00Z'
    UploadCredentials:
      title: Upload Credentials
      type: object
      description: 'Response to a broker upload request. The backend verified the
        calling

        device, created the upload ledger entry, authorized the exact `object_key`

        and provenance, performed digest dedup, and vended short-lived downscoped

        cloud credentials bound to that one object key. The device uploads directly

        via the native cloud SDK, then calls `POST /uploads/{upload_id}/confirm`.

        '
      required:
      - scheme
      - s3_credentials
      - gcs_credentials
      - expires_at
      properties:
        scheme:
          type: string
          enum:
          - s3
          - gcs
          example: gcs
          description: The storage access scheme. Mirrors the `credentials.scheme`
            discriminator so the device can select its SDK before parsing `credentials`.
        s3_credentials:
          type: object
          allOf:
          - $ref: '#/components/schemas/S3UploadCredentials'
          description: The vended S3 downscoped credentials.
          nullable: true
        gcs_credentials:
          type: object
          allOf:
          - $ref: '#/components/schemas/GcsUploadCredentials'
          description: The vended GCS downscoped credentials.
          nullable: true
        expires_at:
          type: string
          format: date-time
          example: '2021-01-01T01:00:00Z'
          description: Timestamp after which the vended credentials expire. On mid-upload
            expiry the device re-requests exact-key credentials and resumes.
      example:
        scheme: gcs
        gcs_credentials:
          scheme: gcs
          access_token: ya29.c.b0Aaekm1J...redacted...opaque-oauth2-token
          expires_at: '2021-01-01T01:00:00Z'
        s3_credentials:
          scheme: s3
          access_key_id: ASIAIOSFODNN7EXAMPLE
          secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          session_token: FwoGZXIvYXdzEBaDOEXAMPLE...redacted...opaque-session-token
          region: us-east-1
          expires_at: '2021-01-01T01:00:00Z'
        expires_at: '2021-01-01T01:00:00Z'
    UploadWithCredentials:
      title: Upload With Credentials
      type: object
      description: 'Response to a broker upload request. The backend verified the
        calling

        device, created the upload ledger entry, authorized the exact `object_key`

        and provenance, performed digest dedup, and vended short-lived downscoped

        cloud credentials bound to that one object key. The device uploads directly

        via the native cloud SDK, then calls `POST /uploads/{upload_id}/confirm`.

        '
      required:
      - upload
      - credentials
      - metadata
      properties:
        upload:
          $ref: '#/components/schemas/Upload'
        credentials:
          $ref: '#/components/schemas/UploadCredentials'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Provenance the device stamps as cloud object metadata on the

            uploaded object (S3 `x-amz-meta-*` / GCS `x-goog-meta-*`). All

            values are strings. Keep the map within the cloud provider''s

            object-metadata size limits (S3 ~2 KB, GCS ~8 KB of combined

            user-defined metadata).


            Only the create response carries this map; `Upload` objects

            returned elsewhere (read/confirm/list) do not include it.


            The currently-expected keys are, as a NON-normative example only:

            `device_id`, `release_id`, `release_version`, `deployment_id`,

            `digest`, `mtime`. This list is illustrative — the map

            is generic and the set of keys may evolve without a schema change.

            '
      example:
        upload:
          object: upload
          id: upl_123
          device_id: dvc_123
          file_rule_id: file_rule_123
          upload_collection_name: Robot Logs
          source:
            file_path: /var/log/robot/robot.log
            mtime: '2021-01-01T00:00:00Z'
            first_observed_at: '2021-01-01T00:00:00Z'
            last_observed_at: '2021-01-01T00:00:05Z'
          destination:
            bucket_id: bkt_123
            bucket_name: my-uploads-bucket
            object_key: logs/dvc_123/robot.log
          digest: sha256:1234567890
          size: 1048576
          status: uploaded
          incomplete: false
          release_id: rls_123
          deployment_id: dpl_123
          uploaded_at: '2021-01-01T00:00:10Z'
          created_at: '2021-01-01T00:00:00Z'
          updated_at: '2021-01-01T00:00:00Z'
          workspace_id: wksp_123
        credentials:
          scheme: gcs
          gcs_credentials:
            scheme: gcs
            access_token: ya29.c.b0Aaekm1J...redacted...opaque-oauth2-token
            expires_at: '2021-01-01T01:00:00Z'
          s3_credentials:
            scheme: s3
            access_key_id: ASIAIOSFODNN7EXAMPLE
            secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
            session_token: FwoGZXIvYXdzEBaDOEXAMPLE...redacted...opaque-session-token
            region: us-east-1
            expires_at: '2021-01-01T01:00:00Z'
          expires_at: '2021-01-01T01:00:00Z'
        metadata:
          device_id: dvc_123
          release_id: rls_123
          release_version: v1.0.0
          deployment_id: dpl_123
          digest: sha256:1234567890
          mtime: '2021-01-01T00:00:00Z'
    DeviceStatus:
      type: string
      description: 'The status of the device.

        - Inactive: The miru agent has not yet been installed / authenticated

        - Activating: The miru agent is currently being installed / authenticated
        (should only last for a few seconds)

        - Online: The miru agent has successfully pinged the server within the last
        60 seconds.

        - Offline: The miru agent has not successfully pinged the server within the
        last 60 seconds (e.g. network issues, device is powered off, etc.)

        - Archived: The device has been archived. The agent''s session has been revoked
        and the device no longer participates in workspace operations. See `archived_at`
        for when this occurred.

        '
      enum:
      - inactive
      - activating
      - online
      - offline
      - archived
      x-enum-varnames:
      - DEVICE_STATUS_INACTIVE
      - DEVICE_STATUS_ACTIVATING
      - DEVICE_STATUS_ONLINE
      - DEVICE_STATUS_OFFLINE
      - DEVICE_STATUS_ARCHIVED
    BaseDevice:
      title: Base Device
      type: object
      required:
      - object
      - id
      - name
      - description
      - status
      - agent_version
      - last_connected_at
      - last_disconnected_at
      - created_at
      - updated_at
      properties:
        object:
          type: string
          enum:
          - device
          example: device
          x-stainless-const: true
          description: The object type, which is always `device`.
        id:
          type: string
          example: dvc_123
          description: ID of the device.
        name:
          type: string
          example: My Device
          description: Name of the device.
        description:
          type: string
          nullable: true
          example: Welder on line 3
          description: A free-form description of the device.
        status:
          $ref: '#/components/schemas/DeviceStatus'
        agent_version:
          type: string
          example: v1.0.0
          description: The version of the agent the device is running.
          nullable: true
        last_connected_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          nullable: true
          description: Timestamp of when the device was last made an initial connection
            (this is not the same as the last time the device was seen).
        last_disconnected_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          nullable: true
          description: Timestamp of when the device was last disconnected (this is
            not the same as the last time the device was seen).
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device was last updated.
    Device:
      title: Device
      allOf:
      - $ref: '#/components/schemas/BaseDevice'
      - type: object
        required:
        - session_id
        properties:
          session_id:
            type: string
            example: dvc_sess_123
            description: Session ID of the device.
      example:
        object: device
        id: dvc_123
        name: My Device
        description: Welder on line 3
        status: online
        agent_version: v1.0.0
        last_connected_at: '2021-01-01T00:00:00Z'
        last_disconnected_at: null
        created_at: '2021-01-01T00:00:00Z'
        updated_at: '2021-01-01T00:00:00Z'
        session_id: dvc_sess_123
    UpdateDeviceFromAgentRequest:
      title: Update Device From Agent Request
      type: object
      properties:
        agent_version:
          type: string
          description: The version of the agent the device is running.
          example: v1.0.0
    ProvisionDeviceRequest:
      title: Provision Device Request
      type: object
      description: Provision a device using a provisioning token.
      required:
      - public_key_pem
      - agent_version
      - name
      properties:
        public_key_pem:
          type: string
          description: The public key in PEM format.
          example: '-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAjVb+KEVBPIGDulBAuAUL\nT8PMvLW+VZ8aZ5p63/uHxM15fSPGnWZ4YtRHVed9gVRufrld3Pei7lP1LB88x6T0\nOPIQjMVXtx87bYSFFSrjqNg9yDUn17HDg7afehXoFuFi/q2QtTBKgOZqnPTRVHEM\nJqVjGCGb70AzpbcS6kdmlGjQY1R9uLbn8hREY+bUq5qgsnC2xfp5iioSYK8bkIUH\nexGybOcSLO21YIIsWoysBPppc1qqSo46L/xK+YjYkdMi3Qt0I07lS6FQk4lbUr6h\nHqRyCVEfUgqX4zy2ba0PHNImokltQfwrljfCZ/odCazCvqbrNptreQLoNVtN7NA4\nYQIDAQAB\n-----END
            PUBLIC KEY-----

            '
        agent_version:
          type: string
          description: The version of the agent the device is running.
          example: v1.0.0
        name:
          type: string
          example: Robot 1
          description: The name to assign to the device.
    ReprovisionDeviceRequest:
      title: Reprovision Device Request
      type: object
      description: 'Reprovision an existing device. Reprovisioning rebinds the device
        record to the calling physical machine: it invalidates any prior session,
        registers the new public key, and triggers a redeploy of the device''s current
        deployment. Deployment history is preserved across the swap. The device''s
        name is not provided here because the target device record already has a name;
        the device is identified by the provisioning token.'
      required:
      - public_key_pem
      - agent_version
      properties:
        public_key_pem:
          type: string
          description: The public key in PEM format.
          example: '-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAjVb+KEVBPIGDulBAuAUL\nT8PMvLW+VZ8aZ5p63/uHxM15fSPGnWZ4YtRHVed9gVRufrld3Pei7lP1LB88x6T0\nOPIQjMVXtx87bYSFFSrjqNg9yDUn17HDg7afehXoFuFi/q2QtTBKgOZqnPTRVHEM\nJqVjGCGb70AzpbcS6kdmlGjQY1R9uLbn8hREY+bUq5qgsnC2xfp5iioSYK8bkIUH\nexGybOcSLO21YIIsWoysBPppc1qqSo46L/xK+YjYkdMi3Qt0I07lS6FQk4lbUr6h\nHqRyCVEfUgqX4zy2ba0PHNImokltQfwrljfCZ/odCazCvqbrNptreQLoNVtN7NA4\nYQIDAQAB\n-----END
            PUBLIC KEY-----

            '
        agent_version:
          type: string
          description: The version of the agent the device is running.
          example: v1.0.0
    TokenResponse:
      title: Token Response
      type: object
      required:
      - token
      - expires_at
      properties:
        token:
          type: string
          description: The token.
          example: eyJhbGciOiJ...
        expires_at:
          type: string
          format: date-time
          description: The expiration date and time of the token.
          example: '2025-01-01T00:00:00Z'
      example:
        token: eyJhbGciOiJ...
        expires_at: '2025-01-01T00:00:00Z'
    SyncDevice:
      type: object
      required:
      - is_synced
      properties:
        is_synced:
          type: boolean
          example: true
          description: Whether the device is synced.
      example:
        is_synced: true
    Ping:
      type: object
      required:
      - message_id
      - timestamp
      properties:
        message_id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier of the ping message.
        timestamp:
          type: string
          format: date-time
          example: '2025-08-27T12:00:00Z'
          description: The timestamp of when the ping was sent.
      example:
        message_id: 123e4567-e89b-12d3-a456-426614174000
        timestamp: '2025-08-27T12:00:00Z'
    Pong:
      type: object
      required:
      - message_id
      - timestamp
      properties:
        message_id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
          description: The unique identifier of the pong message.
        timestamp:
          type: string
          format: date-time
          example: '2025-08-27T12:00:00Z'
          description: The timestamp of when the pong was received.
      example:
        message_id: 123e4567-e89b-12d3-a456-426614174000
        timestamp: '2025-08-27T12:00:00Z'
    Error:
      type: object
      required:
      - code
      - params
      - message
      properties:
        code:
          type: string
          example: invalid_request
          description: The error code identifying the type of error.
        params:
          type: object
          additionalProperties: true
          example:
            param1: value1
            param2: value2
          description: Additional parameters providing context about the error.
        message:
          type: string
          example: This is a message for a user
          description: A human-readable message describing the error.
  parameters:
    MiruVersion:
      name: Miru-Version
      in: header
      required: true
      schema:
        type: string
        example: v0.5
      description: The API version the client was built against.
    config_instance_id:
      name: config_instance_id
      in: path
      required: true
      description: The unique identifier of the config instance.
      schema:
        type: string
        example: cfg_inst_123
    disposition:
      name: disposition
      in: query
      required: false
      description: Controls the Content-Disposition behavior. Use `inline` to display
        in browser or `attachment` to trigger a file download.
      schema:
        type: string
        enum:
        - inline
        - attachment
        default: inline
        example: inline
    offset:
      name: offset
      in: query
      required: false
      description: The offset of the items to return. An offset of 10 with a limit
        of 10 returns items 11-20.
      schema:
        type: integer
        default: 0
        minimum: 0
        example: 0
    limit:
      name: limit
      in: query
      required: false
      description: The maximum number of items to return. A limit of 15 with an offset
        of 0 returns items 1-15.
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
        example: 10
    deployment_list_expansions:
      name: expand
      in: query
      required: false
      description: Fields to expand on each deployment in the list.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DeploymentListExpansion'
        example:
        - release
    deployment_search_activity_status:
      name: activity_status
      in: query
      required: false
      style: form
      explode: false
      description: The deployment activity statuses to filter by.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DeploymentActivityStatus'
        example:
        - drifted
    deployment_id:
      name: deployment_id
      in: path
      required: true
      description: The unique identifier of the deployment.
      schema:
        type: string
        example: dpl_123
    deployment_expansions:
      name: expand
      in: query
      required: false
      description: Fields to expand on the deployment resource.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/DeploymentExpansion'
        example:
        - release
    release_id:
      name: release_id
      in: path
      required: true
      description: The unique identifier of the release.
      schema:
        type: string
        example: rls_123
    release_expansions:
      name: expand
      in: query
      required: false
      description: Fields to expand on the release resource.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ReleaseExpansion'
        example:
        - file_rules
    upload_id:
      name: upload_id
      in: path
      required: true
      description: The unique identifier of the upload.
      schema:
        type: string
        example: upl_123
    git_commit_id:
      name: git_commit_id
      in: path
      required: true
      description: The unique identifier of the git commit.
      schema:
        type: string
        example: git_commit_123
    device_id:
      name: device_id
      in: path
      required: true
      description: The unique identifier of the device.
      schema:
        type: string
        example: dvc_123
