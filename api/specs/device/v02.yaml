          description: Timestamp of when the device was last synced.
        last_attempted_sync_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the last *attempted* sync occurred.
        in_cooldown:
          type: boolean
          example: true
          description: Whether the device is currently in cooldown.
        cooldown_ends_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the cooldown will end.
      example:
        code: in_cooldown
        message: Device is not connected to the backend.
        last_synced_at: '2021-01-01T00:00:00Z'
        last_attempted_sync_at: '2021-01-01T00:00:00Z'
        in_cooldown: true
        cooldown_ends_at: '2021-01-01T00:00:00Z'
    FileRuleSource:
      title: File Rule Source
      type: object
      required:
      - glob
      - stability_window_secs
      properties:
        glob:
          type: string
          pattern: ^/
          maxLength: 1024
          example: /var/log/robot/*.log
          description: A glob pattern selecting the files this rule manages. Must
            be absolute (start with `/`), at most 1024 bytes, and must contain no
            `..` segments and no empty path segments.
        stability_window_secs:
          type: integer
          format: int64
          example: 60
          description: How long, in seconds, a matching file's size and modification
            time must stay unchanged (quiescent) before it is considered finished
            and eligible for upload. Files in a format with a finalization marker
            (e.g. MCAP, parquet) are detected directly; this window is the fallback
            for other files.
      example:
        glob: /var/log/robot/*.log
        stability_window_secs: 60
    FileRuleUpload:
      title: File Rule Upload
      type: object
      required:
      - upload_collection_id
      - upload_collection_name
      - bucket_id
      - bucket_name
      - path
      properties:
        upload_collection_id:
          type: string
          example: upl_col_123
          description: ID of the upload collection the resulting uploads are grouped
            into.
        upload_collection_name:
          type: string
          example: Robot Logs
          description: The name of the upload collection the resulting uploads are
            grouped into.
        bucket_id:
          type: string
          example: bkt_123
          description: ID of the bucket this rule uploads to.
        bucket_name:
          type: string
          example: my-uploads-bucket
          description: Name of the bucket this rule uploads to.
        path:
          type: string
          pattern: .*\{upload_id\}.*
          maxLength: 1024
          example: '{device_id}/{year}-{month}-{day}/{upload_id}/{file_name}'
          description: The object-path template the collected file is written to.
            Must contain `{upload_id}` so every upload lands on a distinct object
            key, be at most 1024 bytes, have balanced braces, and contain no `..`
            segments and no empty path segments. The supported variables are `{device_id}`,
            `{device_name}`, `{file_name}`, `{upload_id}`, `{year}`, `{month}`, `{day}`,
            `{hour}`, and `{minute}`.
      example:
        upload_collection_id: upl_col_123
        upload_collection_name: Robot Logs
        bucket_id: bkt_123
        bucket_name: my-uploads-bucket
        path: '{device_id}/{year}-{month}-{day}/{upload_id}/{file_name}'
    FileRuleRetention:
      title: File Rule Retention
      type: object
      description: 'The retention block a file rule carries when it deletes local
        files; a

        rule without one keeps matching files indefinitely and Miru never

        deletes them. Retention operates in two phases. The retention guarantee

        ends once a matching file goes quiescent — its size and modification

        time have stayed unchanged for `source.stability_window_secs` — and,

        when `require_upload` is `true`, once its upload has been durably

        confirmed; the file is then eligible for deletion, and callers may no

        longer rely on it being present. `ttl_secs` schedules the enforcement

        that follows: how long the file lives on after the guarantee ends

        before the device deletes it. Both phases keep running on the device

        even when no release is deployed, so tearing down a deployment does not

        silently stop reclaiming disk.

        '
      required:
      - ttl_secs
      properties:
        require_upload:
          type: boolean
          example: true
          description: 'Whether a file must have its upload durably confirmed before
            it may be deleted. Present exactly when the rule has an `upload` block.
            When `true`, a slow or failing upload keeps the local file: the device
            abandons an upload after 9 attempts, so a permanently failing upload retains
            the file indefinitely. When `false`, the upload is best-effort: the file
            may be deleted once eligible even if its upload has not completed, and
            an unfinished upload is abandoned.'
        ttl_secs:
          type: integer
          format: int64
          example: 604800
          description: 'How long, in seconds, the file lives on after it becomes eligible
            for deletion. The clock starts when the retention guarantee ends, not
            when the file was written: this schedules enforcement of a guarantee that
            has already ended, so it defers the deletion, not the end of the guarantee.
            `0` means the file is deleted as soon as it becomes eligible.'
      example:
        require_upload: true
        ttl_secs: 604800
    BaseFileRule:
      title: Base File Rule
      type: object
      description: 'A file rule declares which files on a device Miru manages and
        what to do

        with them: upload them to a bucket, delete the local copies once they

        are no longer needed, or both. `retention` is optional and marks the

        rules that delete: when it is absent the device keeps matching files

        indefinitely — Miru never deletes them — and when it is present the rule

        deletes each matching file once its retention guarantee ends. A rule

        that both deletes and uploads always states `retention.require_upload`,

        so whether local deletion waits for the upload is itself an explicit

        decision.

        '
      required:
      - object
      - id
      - name
      - digest
      - source
      - created_at
      - updated_at
      properties:
        object:
          type: string
          enum:
          - file_rule
          example: file_rule
          x-stainless-const: true
          description: The object type, which is always `file_rule`.
        id:
          type: string
          example: file_rule_123
          description: ID of the file rule.
        name:
          type: string
          example: Robot Logs
          description: 'A human-readable name for the file rule. Not unique within
            a workspace: file rules are immutable, so each authored revision mints
            a new rule and several rules may share a name. The name participates in
            the rule''s digest, so renaming a rule mints a new rule.'
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the file rule. File rules are immutable and deduplicated
            by digest within a workspace.
        source:
          $ref: '#/components/schemas/FileRuleSource'
        upload:
          allOf:
          - $ref: '#/components/schemas/FileRuleUpload'
          description: Where matching files are uploaded. Absent when the rule only
            enforces local retention.
        retention:
          allOf:
          - $ref: '#/components/schemas/FileRuleRetention'
          description: Governs deletion of the local copies of matching files. Absent
            when the device keeps matching files indefinitely — Miru never deletes
            them; present when the rule deletes each matching file once its retention
            guarantee ends.
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the file rule was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the file rule was last updated.
      example:
        object: file_rule
        id: file_rule_123
        name: Robot Logs
        digest: sha256:1234567890
        source:
          glob: /var/log/robot/*.log
          stability_window_secs: 60
        upload:
          upload_collection_id: upl_col_123
          upload_collection_name: Robot Logs
          bucket_id: bkt_123
          bucket_name: my-uploads-bucket
          path: '{device_id}/{year}-{month}-{day}/{upload_id}/{file_name}'
        retention:
          require_upload: true
          ttl_secs: 604800
        created_at: '2021-01-01T00:00:00Z'
        updated_at: '2021-01-01T00:00:00Z'
    GitCommit:
      title: Git Commit
      type: object
      required:
      - object
      - id
      - sha
      - message
      - commit_url
      - created_at
      properties:
        object:
