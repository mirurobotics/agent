info:
  title: Miru Agent API
  description: 'The API between the Miru Agent and any external client living on the
    same device as the Miru Agent. On Linux the agent serves it over the Unix socket
    `/run/miru/miru.sock` with no authentication. Over loopback TCP, which is on by
    default on Windows at `127.0.0.1:6478`, every route requires `Authorization: Bearer
    <token>`. Clients read the port and token from the agent''s discovery file, `%ProgramData%\Miru\device-api\device-api.json`
    on Windows; the token changes every time the agent starts.'
  version: v0.2
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-release-version: v0.2.3-beta.1
  x-git-commit:
    sha: 0db74946ec71e50ae8fee685e3ccdd8eb1729c8d
    url: https://github.com/mirurobotics/openapi/commit/0db74946ec71e50ae8fee685e3ccdd8eb1729c8d
    message: 'feat(calibrations): rename component_slug to component in agent CreateCalibrationRequest
      (#339)


      <!-- claude-projects-attribution: {"github_login":"miru-agents"} -->

      _Requested by **bens-agent** · [project

      thread](https://claude.ai/code/project/chan_01RNCMaVSP1K69BTB8Xydgqo?thread=cmsg_01RNCMaVSP1K69BTB8Xydgqo5Gp6P8wHEHNyy5pva2AtoR)_


      ## Summary


      Renames `CreateCalibrationRequest.component_slug` to `component` in the

      agent-facing backend spec for `POST /calibrations`, as asked in

      https://github.com/mirurobotics/agent/pull/357#discussion_r4344008654.

      The meaning is unchanged (the component''s slug) and the field is still

      required. This matches `role` and `aspect`, which are slugs too and

      carry no `_slug` suffix.


      ## Changes


      - `apis/apps/backend-server/agent/components/requests/calibration.yaml`:

      field and `required` entry renamed; description now reads like `role`''s

      and `aspect`''s ("Miru resolves it to the component, creating the

      component the first time it is reported").

      - `apis/apps/backend-server/agent/paths/calibrations.yaml`: operation

      description refers to a new `component` slug.

      - `apis/apps/backend-server/agent/openapi.gen.yaml`: regenerated.


      There were no request examples mentioning `component_slug` to update.


      ## Not in this PR


      - The device API (`apis/apps/device-server`) still uses

      `component_slug`; this PR only covers the backend agent audience.

      - The backend must accept `component` before an agent build sends it;

      that change is tracked in mirurobotics/backend separately.


      ## Testing


      `./scripts/regen.sh` and `./scripts/lint.sh` pass locally.


