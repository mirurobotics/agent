          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /version:
    get:
      tags:
      - Agent
      summary: Version
      description: Retrieve the version of the agent.
      operationId: version
      responses:
        '200':
          description: Successfully retrieved the version of the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /calibrations:
    post:
      tags:
      - Calibrations
      summary: Create
      operationId: createCalibration
      description: Report a calibration to Miru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalibrationRequest'
      responses:
        '200':
          description: The agent saved the calibration and will upload it to Miru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCalibrationResponse'
  /calibrations/latest:
    get:
      tags:
      - Calibrations
      summary: List Latest
      operationId: listLatestCalibrations
      description: List the latest calibration for each component, role and aspect
        on the device.
      parameters:
      - $ref: '#/components/parameters/calibration_search_component'
      - $ref: '#/components/parameters/calibration_search_role'
      - $ref: '#/components/parameters/calibration_search_aspect'
      responses:
        '200':
          description: Successfully listed the latest calibrations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestCalibrationsResponse'
  /calibrations/{report_id}/content:
    get:
      tags:
      - Calibrations
      summary: Download Content
      operationId: getCalibrationContent
      description: Download the content of a latest calibration by its report ID.
        An older report returns 404.
      parameters:
      - $ref: '#/components/parameters/report_id'
      responses:
        '200':
          description: Successfully retrieved the calibration content. The Content-Type
