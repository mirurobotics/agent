paths:
  /health:
    get:
      tags:
      - Agent
      summary: Health
      description: Retrieve the health of the agent.
      operationId: health
      responses:
        '200':
          description: Successfully retrieved the health of the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /version:
    get:
      tags:
      - Agent
      summary: Version
      description: Retrieve the version of the agent.
      operationId: version
      responses:
        '200':
          description: Successfully retrieved the version of the agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /calibrations:
    post:
      tags:
      - Calibrations
      summary: Create
      operationId: createCalibration
      description: 'Report a calibration to Miru. The agent checks the request,

        saves the calibration on the device and returns right away,

        without waiting for Miru. It uploads saved calibrations to Miru

        in the order received and retries until Miru is reachable, so a

        calibration survives network outages and agent restarts. The

        agent checks the request against Miru''s rules before saving it,

        so Miru rarely rejects one later; one it does reject, such as a

        new component once the workspace holds 100, is set aside on the

        device and does not hold up later ones. Content is at most 1 MiB

        and a request is at most about 2 MiB (1 MiB of content plus JSON

        escaping). Each request is a new calibration, so sending the

        same calibration twice records it twice. If the agent loses

        Miru''s response to an upload, for example to a timeout or a

        restart, it uploads the calibration again, so on rare occasions

        Miru records one twice.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalibrationRequest'
      responses:
        '200':
          description: The agent saved the calibration and will upload it to Miru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCalibrationResponse'
  /deployments/{deployment_id}:
    get:
      tags:
      - Deployments
      summary: Get
      operationId: getDeployment
      description: Retrieve a deployment by its ID.
      parameters:
      - $ref: '#/components/parameters/deployment_id'
      responses:
        '200':
          description: Successfully retrieved the deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
  /deployments/current:
    get:
      tags:
      - Deployments
      summary: Get Current
      operationId: getCurrentDeployment
      description: Get the current deployment for the device.
      responses:
        '200':
          description: Successfully retrieved the current deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
  /device:
    get:
      tags:
      - Device
      summary: Get
      description: Retrieve the device.
      operationId: getDevice
      responses:
        '200':
          description: Successfully retrieved the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /device/sync:
    post:
      tags:
      - Device
      summary: Sync
      description: Manually force a device sync with the edits made in the dashboard.
      operationId: syncDevice
      responses:
        '200':
          description: Successfully synced the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncDeviceResponse'
  /file_rules/{file_rule_id}:
    get:
      tags:
      - File Rules
      summary: Get
      description: Retrieve a file rule by its ID.
      operationId: getFileRule
      parameters:
      - $ref: '#/components/parameters/file_rule_id'
      responses:
        '200':
          description: Successfully retrieved the file rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseFileRule'
  /git_commits/{git_commit_id}:
    get:
      tags:
      - Git Commits
      summary: Get
      description: Retrieve a git commit by its ID.
      operationId: getGitCommit
      parameters:
      - $ref: '#/components/parameters/git_commit_id'
      responses:
        '200':
          description: Successfully retrieved the git commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitCommit'
  /releases/{release_id}:
    get:
      tags:
      - Releases
      summary: Get
      description: Retrieve a release by its ID.
      operationId: getRelease
      parameters:
      - $ref: '#/components/parameters/release_id'
      responses:
        '200':
          description: Successfully retrieved the release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /releases/current:
    get:
      tags:
      - Releases
      summary: Get Current
      description: Retrieve the current release.
      operationId: getCurrentRelease
      responses:
        '200':
          description: Successfully retrieved the current release.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
  /events:
    get:
      tags:
      - Events
      summary: Stream Events
      operationId: streamEvents
      description: 'Subscribe to a Server-Sent Events (SSE) stream of agent lifecycle
        events.


        The stream replays retained historical events after the cursor, then

        delivers live events as they occur. Events are delivered at-least-once;

        clients should deduplicate by event `id`.


        Use the `after` query parameter or `Last-Event-ID` header to resume

        from a previous position. If the cursor is older than the earliest

        retained event, the server returns `410 Gone`.

        '
      parameters:
      - name: after
        in: query
        required: false
        description: Event ID cursor. Only events with `id` greater than this value
          are returned. Takes precedence over the `Last-Event-ID` header.
        schema:
          type: integer
          format: int64
        example: 42
      - name: types
        in: query
        required: false
        description: Event types to receive. If omitted, all event types are sent.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
        example:
        - deployment.deployed
        - deployment.removed
      - name: Last-Event-ID
        in: header
        required: false
        description: Standard SSE reconnection header. Used as the replay cursor if
          `after` query parameter is not provided.
        schema:
          type: string
        example: '42'
      responses:
        '200':
          description: SSE event stream. Each event is delivered as an SSE frame with
            `id`, `event`, and `data` fields.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Event'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: The token from the agent's discovery file (`%ProgramData%\Miru\device-api\device-api.json`
        on Windows). Required over loopback TCP (`127.0.0.1:6478` by default on Windows)
        and accepted by every route; not used over the Unix socket.
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    APIVersion:
      type: string
      enum:
      - v0.2
      x-enum-varnames:
      - API_VERSION
      x-stainless-const: true
    ReleaseVersion:
      type: string
      enum:
      - v0.2.3-beta.1
      x-enum-varnames:
      - RELEASE_VERSION
      x-stainless-const: true
    APIGitCommit:
      type: string
      enum:
      - 0db74946ec71e50ae8fee685e3ccdd8eb1729c8d
      x-enum-varnames:
      - API_GIT_COMMIT
      x-stainless-const: true
    DeploymentDeployedEvent:
      title: DeploymentDeployedEvent
      type: object
      x-summary: A deployment's config instances have been written to the device's
        file system.
      description: Emitted when a deployment's config instances have been written
        to the device's file system and are available for consumption. Use this event
        to reload configuration, restart dependent services, or confirm that new configuration
        is live on the device.
      required:
      - deployment_id
      - release_id
      - status
      - activity_status
      - error_status
      - target_status
      properties:
        deployment_id:
          type: string
          description: ID of the deployment.
          example: dpl_123
        release_id:
          type: string
          description: ID of the release associated with this deployment.
          example: rls_123
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        activity_status:
          $ref: '#/components/schemas/DeploymentActivityStatus'
        error_status:
          $ref: '#/components/schemas/DeploymentErrorStatus'
        target_status:
          $ref: '#/components/schemas/DeploymentTargetStatus'
        deployed_at:
          type: string
          format: date-time
          description: Timestamp of when the deployment was deployed.
          example: '2026-03-10T12:00:00Z'
      example:
        deployment_id: dpl_123
        release_id: rls_123
        status: deployed
        activity_status: deployed
        error_status: none
        target_status: deployed
        deployed_at: '2026-03-10T12:00:00Z'
    DeploymentRemovedEvent:
      title: DeploymentRemovedEvent
      type: object
      x-summary: A deployment's config instances have been removed from the device's
        file system.
      description: Emitted when a deployment's config instances have been removed
        from the device's file system and the deployment has been archived. Use this
        event to clean up resources or stop services that depended on the removed
        configuration.
      required:
      - deployment_id
      - release_id
      - status
      - activity_status
      - error_status
      - target_status
      properties:
        deployment_id:
          type: string
          description: ID of the deployment.
          example: dpl_123
        release_id:
          type: string
          description: ID of the release associated with this deployment.
          example: rls_123
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        activity_status:
          $ref: '#/components/schemas/DeploymentActivityStatus'
        error_status:
          $ref: '#/components/schemas/DeploymentErrorStatus'
        target_status:
          $ref: '#/components/schemas/DeploymentTargetStatus'
        archived_at:
          type: string
          format: date-time
          description: Timestamp of when the deployment was archived.
          example: '2026-03-10T12:00:00Z'
      example:
        deployment_id: dpl_123
        release_id: rls_123
        status: archived
        activity_status: archived
        error_status: none
        target_status: archived
        archived_at: '2026-03-10T12:00:00Z'
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The status of the agent.
          example: ok
      example:
        status: ok
    VersionResponse:
      type: object
      required:
      - version
      - git_commit
      - api_version
      - api_git_commit
      - api_release_version
      - rust_version
      - build_date
      - os
      - arch
      properties:
        version:
          type: string
          description: The version of the agent.
          example: v1.0.0
        git_commit:
          type: string
          description: The git commit of the agent.
          example: a1b2c3d4
        api_version:
          type: string
          description: The API version of the agent.
          example: v0.2
        api_git_commit:
          type: string
          description: The git commit of the API.
          example: a1b2c3d4
        api_release_version:
          type: string
          description: The API release version of the agent.
          example: v0.2.3-beta.1
        rust_version:
          type: string
          description: The version of Rust.
          example: 1.93.0
        build_date:
          type: string
          format: date-time
          description: The build date of the agent.
          example: '2026-02-24T10:30:00Z'
        os:
          type: string
          description: The operating system of the agent.
          example: linux
        arch:
          type: string
          description: The architecture of the agent.
          example: aarch64
      example:
        version: v1.0.0
        git_commit: a1b2c3d4
        api_version: v0.2
        api_git_commit: a1b2c3d4
        api_release_version: v0.2.3-beta.1
        rust_version: 1.93.0
        build_date: '2026-02-24T10:30:00Z'
        os: linux
        arch: aarch64
    InstanceFormat:
      title: Instance Format
      type: string
      description: 'The serialization format of config content. A config instance
        is written to the device filesystem in this format.

        - `json`: standard JSON.

        - `yaml`: YAML 1.2.

        - `jsonc`: JSON with comments (JSON plus `//` and `/* */` comment syntax).

        - `xml`: XML.

        - `text`: plain, unstructured text with no specific format.

        '
      enum:
      - json
      - yaml
      - jsonc
      - xml
      - text
      x-enum-varnames:
      - INSTANCE_FORMAT_JSON
      - INSTANCE_FORMAT_YAML
      - INSTANCE_FORMAT_JSONC
      - INSTANCE_FORMAT_XML
      - INSTANCE_FORMAT_TEXT
    InstanceContent:
      title: Instance Content
      type: object
      required:
      - format
      - data
      properties:
        format:
          $ref: '#/components/schemas/InstanceFormat'
        data:
          type: string
          description: The content's values, serialized in `format`.
          example: "{\n  \"enable_autonomy\": true,\n  \"enable_remote_control\":\
            \ true,\n  \"max_payload_kg\": 10.0\n}\n"
      example:
        format: json
        data: "{\n  \"enable_autonomy\": true,\n  \"enable_remote_control\": true,\n\
          \  \"max_payload_kg\": 10.0\n}\n"
    CreateCalibrationRequest:
      title: Create Calibration Request
      type: object
      required:
      - component_slug
      - content
      properties:
        component_slug:
          type: string
          example: arm
          description: Slug of the component the calibrated unit belongs to. A new
            slug creates a component in Miru.
        role:
          type: string
          example: aligner-1
          description: Slug of the role the calibrated unit fills on the device, such
            as `aligner-1` or `front-left`. Distinguishes several units of one component
            on a device. Validated like a slug. Miru resolves it to one of the component's
            `roles`, creating the role the first time it is reported.
        serial_number:
          type: string
          maxLength: 255
          example: M500-1234
          description: Serial number of the physical unit that was calibrated, not
            of the device, such as `M500-1234`. Free text, at most 255 characters.
        aspect:
          type: string
          example: pose
          description: Slug of the aspect of the unit that was calibrated, when it
            has more than one, e.g. `intrinsics` vs `extrinsics`, or `pose` vs `home-offsets`.
            Validated like a slug. Miru resolves it to one of the component's `aspects`,
            creating the aspect the first time it is reported.
        content:
          allOf:
          - $ref: '#/components/schemas/InstanceContent'
          description: The calibration's content, at most 1 MiB. The agent uploads
            it to Miru unchanged.
    CreateCalibrationResponse:
      title: Create Calibration Response
      type: object
      required:
      - reported_at
      properties:
        reported_at:
          type: string
          format: date-time
          example: '2026-03-10T12:00:00Z'
          description: Timestamp of when the agent received the calibration. Miru
            stores it as the time the calibration was reported.
      example:
        reported_at: '2026-03-10T12:00:00Z'
    DeploymentStatus:
      type: string
      description: 'This status merges the ''activity_status'' and ''error_status''
        fields, with error states taking precedence over activity states when errors
        are present. For example, if the activity status is ''deployed'' but the error
        status is ''failed'', the status is ''failed''. However, if the error status
        is ''none'' and the activity status is ''deployed'', the status is ''deployed''.

        '
      enum:
      - drifted
      - staged
      - queued
      - deployed
      - removing
      - archived
      - failed
      - retrying
      x-enum-varnames:
      - DEPLOYMENT_STATUS_DRIFTED
      - DEPLOYMENT_STATUS_STAGED
      - DEPLOYMENT_STATUS_QUEUED
      - DEPLOYMENT_STATUS_DEPLOYED
      - DEPLOYMENT_STATUS_REMOVING
      - DEPLOYMENT_STATUS_ARCHIVED
      - DEPLOYMENT_STATUS_FAILED
      - DEPLOYMENT_STATUS_RETRYING
    DeploymentActivityStatus:
      type: string
      description: 'Last known activity state of the deployment.


        `drifted` means the device''s configurations have drifted since this deployment
        was staged, and the deployment needs to be reviewed before it can be deployed.


        `staged` means the deployment is ready to be deployed.


        `queued` means the deployment''s config instances are waiting to be received
        by the device and will be deployed as soon as the device is online.


        `deployed` means the deployment''s config instances are currently available
        for consumption on the device.


        `removing` means the deployment''s config instances are being removed from
        the device.


        `archived` means the deployment is available for historical reference but
        cannot be deployed and is not active on the device.

        '
      enum:
      - drifted
      - staged
      - queued
      - deployed
      - removing
      - archived
      x-enum-varnames:
      - DEPLOYMENT_ACTIVITY_STATUS_DRIFTED
      - DEPLOYMENT_ACTIVITY_STATUS_STAGED
      - DEPLOYMENT_ACTIVITY_STATUS_QUEUED
      - DEPLOYMENT_ACTIVITY_STATUS_DEPLOYED
      - DEPLOYMENT_ACTIVITY_STATUS_REMOVING
      - DEPLOYMENT_ACTIVITY_STATUS_ARCHIVED
    DeploymentErrorStatus:
      type: string
      description: 'Last known error state of the deployment.


        `none` means there are no errors.


        `retrying` means an error has been encountered and the agent is retrying to
        reach the target status.


        `failed` means a fatal error has been encountered; the deployment is archived
        and, if deployed, removed from the device.

        '
      enum:
      - none
      - failed
      - retrying
      x-enum-varnames:
      - DEPLOYMENT_ERROR_STATUS_NONE
      - DEPLOYMENT_ERROR_STATUS_FAILED
      - DEPLOYMENT_ERROR_STATUS_RETRYING
    DeploymentTargetStatus:
      type: string
      description: 'Desired state of the deployment.


        `staged` means the deployment is ready to be deployed.


        `deployed` means all config instances in the deployment are available for
        consumption on the device.


        `archived` means the deployment is available for historical reference but
        cannot be deployed and is not active on the device.

        '
      enum:
      - staged
      - deployed
      - archived
      x-enum-varnames:
      - DEPLOYMENT_TARGET_STATUS_STAGED
      - DEPLOYMENT_TARGET_STATUS_DEPLOYED
      - DEPLOYMENT_TARGET_STATUS_ARCHIVED
    Deployment:
      title: Deployment
      type: object
      required:
      - object
      - id
      - description
      - status
      - activity_status
      - error_status
      - target_status
      - device_id
      - release_id
      - created_at
      properties:
        object:
          type: string
          enum:
          - deployment
          example: deployment
          x-stainless-const: true
          description: The object type, which is always `deployment`.
        id:
          type: string
          example: dpl_123
          description: ID of the deployment.
        description:
          type: string
          example: Deployment for the motion control config instance
          description: The description of the deployment.
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        activity_status:
          $ref: '#/components/schemas/DeploymentActivityStatus'
        error_status:
          $ref: '#/components/schemas/DeploymentErrorStatus'
        target_status:
          $ref: '#/components/schemas/DeploymentTargetStatus'
        device_id:
          type: string
          example: dvc_123
          description: ID of the device.
        release_id:
          type: string
          example: rls_123
          description: ID of the release.
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: Timestamp of when the deployment was created.
      example:
        object: deployment
        id: dpl_123
        description: Deployment for the motion control config instance
        status: staged
        activity_status: staged
        error_status: none
        target_status: staged
        device_id: dvc_123
        release_id: rls_123
        created_at: '2024-01-01T00:00:00Z'
    DeviceStatus:
      type: string
      description: 'The status of the device.

        - Online: The miru agent is connected

        - Offline: The miru agent is disconnected (e.g. network issues, device is
        powered off, etc.)

        '
      enum:
      - online
      - offline
      x-enum-varnames:
      - DEVICE_STATUS_ONLINE
      - DEVICE_STATUS_OFFLINE
    Device:
