openapi: 3.0.3
info:
  title: Miru Agent API
  description: The API between the Miru Agent and any external client living on the
    same device as the Miru Agent
  version: v0.2
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-release-version: v0.2.2
  x-git-commit:
    sha: 81f3a3a05a8a3c4e6502304248e73aa7683895b8
    url: https://github.com/mirurobotics/openapi/commit/81f3a3a05a8a3c4e6502304248e73aa7683895b8
    message: 'feat(device): add file_rule_ids to releases and GET /file_rules/{file_rule_id}
      (#291)


      ## Summary


      - Adds a required `file_rule_ids` array (`string[]`) to the

      device-server `Release` schema. It is an empty array when the release

      has no file rules. Both the property and the schema-level `example`

      include `["file_rule_123"]`.

      - Adds `GET /file_rules/{file_rule_id}` (`getFileRule`, tag `File

      Rules`) to the Device API. It returns the shared `BaseFileRule` and

      reuses the shared `file_rule_id` path parameter from

      `apis/configs/params.yaml`.

      - Registers a `file_rules` resource in `tools/stainless/device.yml`

      (`retrieve: get /file_rules/{file_rule_id}`, model `file_rule` →

      `BaseFileRule`). MIRU018 route parity requires this. Without it, lint

      fails with `Route get /file_rules/{file_rule_id} is in OpenAPI spec but

      not in Stainless config`.

      - Regenerates `apis/apps/device-server/openapi.gen.yaml`. No other

      bundle changes.


      ## Why the design changed


      This PR first added `expand=file_rules` to the release endpoints (commit

      `93ef737`). That approach is **reverted** in a new revert commit

      (`805d8e9`), with no history rewritten. The Device API already

      references related resources by ID and has a GET for each. For example,

      `Deployment.release_id` → `GET /releases/{release_id}` and

      `Release.git_commit_id` → `GET /git_commits/{git_commit_id}`. The Device

      API has no `expand` parameter anywhere, so `expand=file_rules` would

      have been the first. The IDs go on `Release`, not `Deployment`, because

      every Miru API attaches file rules to releases (e.g.

      `CreateReleaseRequest.file_rule_ids`). The agent also already stores

      `file_rule_ids` on its internal release model.


      The branch also merges `origin/main` with a merge commit, which brings

      in #290 (custom-code tracking files only; bundles stay fresh).


      ## Client flow


      1. `GET /releases/current` returns the release of the currently deployed

      deployment, including `file_rule_ids`.

      2. `GET /file_rules/{id}` for each ID.

      3. Check `upload`. A rule uploads files when `upload` is present.

      Retention-only rules omit it.


      With the generated Python device SDK:


      ```python

      rel = client.releases.current()

      uploads = any(client.file_rules.retrieve(i).upload is not None for i in rel.file_rule_ids)

      ```


      ## Versioning


      The change is additive and backward compatible for clients. The API

      version stays `v0.2`, and the socket URL stays `http://localhost/v0.2`.

      It ships as Device API `v0.2.2` when a maintainer tags `device/v0.2.2`

      on the merge commit on `main` after merge. No source file is bumped,

      because `x-release-version` is written at release time from the tag.


      ## Validation


      - `scripts/preflight.sh`: all checks passed (MIRU lint + Redocly lint,

      surface lint, tool tests and coverage).

      - `scripts/is-stale.sh`: all generated specs are up to date after every

      commit.

      - Acceptance script against the bundle: `Release.file_rule_ids` is

      required, `expand`/`ReleaseExpansion` are gone, `getFileRule` returns

      `BaseFileRule`, and the servers URL is unchanged.

      - MIRU018 guard: removing the Stainless entry makes lint fail for `get

      /file_rules/{file_rule_id}`, and restoring it makes lint pass.


      ## Out of scope (follow-ups)


      - Agent: serving `Release.file_rule_ids` and `GET

      /file_rules/{file_rule_id}` from its local file-rule cache (404 when not

      cached).

      - Device SDK release.

      - Docs-repo updates.


      Plan: `plans/active/20260922-device-file-rule-ids-and-endpoint.md`.


      🤖 Generated with [Claude Code](https://claude.com/claude-code)


      https://claude.ai/code/session_014KRJokLfSVXNVbkJFpQK44


      ---------


      Co-authored-by: Claude <noreply@anthropic.com>'
    author: miru-agents
    branch: HEAD
    dirty: false
